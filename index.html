  {id:"ah", name:"安徽省情", icon:"🗺️", desc:"地理区划 · 经济科技 · 文化名片 · 发展战略"},
  {id:"pl", name:"政治理论", icon:"📖", desc:"新思想 · 二十大 · 四中全会 · 法治常识"},
  {id:"sz", name:"时政热点", icon:"📰", desc:"十五五 · 2026两会 · 建党105周年 · 科技大事"},
  {id:"ls", name:"历史人文", icon:"🏺", desc:"安徽名人 · 徽文化 · 古代史 · 近现代史"},
  {id:"yy", name:"言语成语", icon:"🔤", desc:"安徽高频成语词语 · 释义 · 辨析 · 语境"},
  {id:"zt", name:"真题实战", icon:"🎯", desc:"2024/2025安徽省考常识真题 · 原题原解"}
];
const catName = c => (CATS.find(x=>x.id===c)||{}).name || "未分类";

/* ================= 状态持久化 ================= */
const LS_KEY = "wtt_state_v1";
const defaultState = () => ({
  records:{},        // qid -> {r:对次数, w:错次数, last:'r'|'w', ts}
  srs:{},            // qid -> {iv:间隔天数, ef:难度系数, n:连对次数, due:下次复习时间戳, last, ts}
  wrong:[],          // 错题 id 有序列表
  fav:[],            // 收藏 id
  custom:[],         // 导入的题目（覆盖/新增）
  daily:{},          // 'YYYY-MM-DD' -> {n, r}
  exams:[],          // 测验历史
  session:null,      // 进行中的练习/测验
  settings:{autoRemoveWrong:true, dark:false, dailyNew:15, repo:{user:"",repo:"ah-exam-bank",branch:"main",giteeUser:"",custom:"",auto:true}},
  sync:null            // 云端同步信息 {version, at, source}
});
let S = defaultState();
try{
  const raw = localStorage.getItem(LS_KEY);
  if(raw){ const p = JSON.parse(raw); S = Object.assign(defaultState(), p); S.settings = Object.assign(defaultState().settings, p.settings||{}); }
}catch(e){ console.warn("状态读取失败", e); }
S.settings.repo = Object.assign(defaultState().settings.repo, S.settings.repo||{});
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){ toast("保存失败：浏览器存储不可用"); } }

const allQuestions = () => {
  const over = {}; S.custom.forEach(q=>over[q.id]=q);
  return QUESTIONS.map(q=>over[q.id]||q).concat(S.custom.filter(q=>!QUESTIONS.some(b=>b.id===q.id)));
};
const byId = id => allQuestions().find(q=>q.id===id);
const todayKey = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
function markDaily(right){ const k=todayKey(); if(!S.daily[k]) S.daily[k]={n:0,r:0}; S.daily[k].n++; if(right) S.daily[k].r++; }
function recordAnswer(q, right){
  const rec = S.records[q.id] || {r:0,w:0,last:'',ts:0};
  if(right) rec.r++; else rec.w++;
  rec.last = right?'r':'w'; rec.ts = Date.now();
  S.records[q.id]=rec;
  if(!right){ if(!S.wrong.includes(q.id)) S.wrong.push(q.id); }
  else if(S.settings.autoRemoveWrong){ S.wrong = S.wrong.filter(x=>x!==q.id); }
  markDaily(right); save();
}
function streak(){
  let n=0; const d=new Date();
  for(;;){ const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    if(S.daily[k] && S.daily[k].n>0){ n++; d.setDate(d.getDate()-1); } else break; }
  return n;
}

/* ================= 视图框架 ================= */
const $ = s => document.querySelector(s);
const app = $("#app");
const VIEWS = [["home","首页"],["review","今日"],["practice","练习"],["exam","测验"],["wrong","错题本"],["fav","收藏"],["stats","统计"],["bank","题库"],["cloud","云端"]];
let cur = {name:"home"};
function renderNav(){
  $("#nav").innerHTML = VIEWS.map(v=>`<button data-v="${v[1]}" class="${cur.name===v[0]?"on":""}">${v[1]}</button>`).join("");
  $("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.v==="今日"?"review":b.dataset.v==="练习"?"practice":b.dataset.v==="测验"?"exam":b.dataset.v==="错题本"?"wrong":b.dataset.v==="收藏"?"fav":b.dataset.v==="统计"?"stats":b.dataset.v==="题库"?"bank":b.dataset.v==="云端"?"cloud":"home"));
  $("#foot").innerHTML = `吾日三省 · 内置题库 ${BANK_VERSION} · 学习数据仅存于本机浏览器 · 可在「题库」页导入更新包`;
}
function go(name, params){
  cur = {name, params:params||{}};
  window.scrollTo(0,0);
  const R = {home:renderHome, review:renderReview, practice:renderPracticeEntry, exam:renderExamSetup, wrong:renderWrong, fav:renderFav, stats:renderStats, bank:renderBank, cloud:renderCloud,
             practicing:renderPracticeSession, examining:renderExamSession, examdone:renderExamResult, practicedone:renderPracticeDone};
  (R[name]||renderHome)();

/* ================= 墨墨式记忆调度（间隔重复） ================= */
const DAY = 86400000;
function fmtDue(ts){
  if(ts<=Date.now()) return "已到期";
  const diff=ts-Date.now();
  if(diff < 12*3600000){ const h=Math.floor(diff/3600000), m=Math.max(1,Math.floor(diff%3600000/60000)); return h>0? h+"小时后" : m+"分钟后"; }
  const d = Math.ceil(diff/DAY);
  const dt = new Date(ts);
  return d<=1?"明天":d<7?(d+" 天后（"+(dt.getMonth()+1)+"/"+dt.getDate()+"）"):(dt.getFullYear()==new Date().getFullYear()?((dt.getMonth()+1)+"月"+dt.getDate()+"日"):(dt.getFullYear()+"/"+(dt.getMonth()+1)+"/"+dt.getDate()));
}
function gradeSRS(qid, right){
  const r = S.srs[qid] || {iv:0, ef:2.35, n:0, due:0, last:"", ts:0};
  if(right){
    r.n++;
    if(r.n===1) r.iv=1;
    else if(r.n===2) r.iv=3;
    else if(r.n===3) r.iv=7;
    else r.iv=Math.min(365, Math.round(r.iv*r.ef));
    r.ef=Math.min(2.8, Math.max(1.7, r.ef+0.04));
  } else {
    r.n=0; r.iv=0; r.ef=Math.max(1.7, r.ef-0.18);
  }
  r.due = Date.now() + (r.iv>0 ? r.iv*DAY : 10*60000);
  r.last = right?"r":"w"; r.ts=Date.now();
  S.srs[qid]=r;
  return r;
}
function dueList(){
  const now=Date.now();
  return Object.keys(S.srs).filter(id=>S.srs[id].due<=now && byId(id)).sort((a,b)=>S.srs[a].due-S.srs[b].due);
}
function srsCounts(){
  const vals=Object.values(S.srs);
  return {
    mastered: vals.filter(r=>r.iv>=30).length,
    learning: vals.filter(r=>r.iv>0&&r.iv<30).length,
    due: dueList().length,
    fresh: allQuestions().filter(q=>!S.srs[q.id]).length
  };
}
function reviewForecast(){
  const now=Date.now(); const b=[["今日",0],["明天",0],["3天内",0],["7天内",0],["15天内",0],["更远",0]];
  Object.values(S.srs).forEach(r=>{ const d=(r.due-now)/DAY;
    if(d<=0) b[0][1]++; else if(d<=1) b[1][1]++; else if(d<=3) b[2][1]++; else if(d<=7) b[3][1]++; else if(d<=15) b[4][1]++; else b[5][1]++; });
  return b;
}
function startReview(newQuota){

function balancedPick(pool, n, cats){
  const byCat={}; pool.forEach(q=>{ (byCat[q.c]=byCat[q.c]||[]).push(q); });

    for(const k of keys){ if(byCat[k].length && out.length<n){ out.push(byCat[k].pop()); added=true; } }
    if(!added) break;
  }
  return shuffle(out).slice(0,n);
}

  if(ses.deadline){ remain=Math.max(0,ses.deadline-Date.now()); if(remain<=0) return submitExam(true); }
  app.innerHTML=`

  </div>
  <div class="pbar"><i style="width:${Math.round((ses.idx)/qs.length*100)}%"></i></div>
  <div class="card">
    <div class="qtext">${esc(q.q)}</div>
    <div class="opts">
      ${q.o.map((t,i)=>`<button class="opt ${chosen===i?"sel":""}" data-i="${i}"><span class="k">${optLetter(i)}</span><span>${esc(t)}</span></button>`).join("")}
    </div>

      <button class="btn ghost" id="ePrev" ${ses.idx===0?"disabled":""}>← 上一题</button>

      <button class="btn danger" id="eSubmit2" style="margin-left:auto">提前交卷</button>
    </div>
  </div>
  <div class="card">
    <div class="muted" style="margin-bottom:8px">答题卡（点击跳题，蓝框为已答）：</div>
    <div class="sheet">${qs.map((x,i)=>`<button class="${ses.answers[x.id]!==undefined?"ans":""} ${i===ses.idx?"cur":""}" data-j="${i}">${i+1}</button>`).join("")}</div>
  </div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ ses.answers[q.id]=+b.dataset.i; save(); renderExamSession(); });
  const pv=$("#ePrev"); if(pv) pv.onclick=()=>{ ses.idx--; save(); renderExamSession(); };
  const nx=$("#eNext"); if(nx) nx.onclick=()=>{ ses.idx++; save(); renderExamSession(); };
  const sb=$("#eSubmit"); if(sb) sb.onclick=()=>trySubmit(qs.length);
  $("#eSubmit2").onclick=()=>trySubmit(qs.length);
  app.querySelectorAll(".sheet button").forEach(b=>b.onclick=()=>{ ses.idx=+b.dataset.j; save(); renderExamSession(); });
  if(remain!==null){
    const t=$("#exTimer");
    const tick=()=>{ const r=Math.max(0,ses.deadline-Date.now());
      t.textContent="⏱ "+String(Math.floor(r/60000)).padStart(2,"0")+":"+String(Math.floor(r%60000/1000)).padStart(2,"0");
      t.className="timer "+(r>60000?"calm":"");
      if(r<=0){ clearInterval(iv); submitExam(true); } };
    const iv=setInterval(tick,500); tick();
  }
}
function trySubmit(total){
  const ans=Object.keys(S.session.answers).length;
  if(ans<total) return confirmBox("交卷确认",`已答 ${ans} / ${total} 题，未答题按错误计。确定交卷？`,()=>submitExam(false));
  submitExam(false);
}
function submitExam(auto){
  const ses=S.session; if(!ses||ses.kind!=="exam") return go("home");
  const qs=ses.qids.map(byId).filter(Boolean);
  let right=0;
  const detail=qs.map(q=>{ const a=ses.answers[q.id]; const ok=a===q.a; if(ok)right++;
    return {id:q.id, chosen:a, ok}; });
  qs.forEach(q=>{ const a=ses.answers[q.id]; if(a!==undefined) recordAnswer(q, a===q.a); });
  const total=qs.length, acc=total?Math.round(right/total*100):0;
  ses.result={right,total,acc,detail,auto}; ses.finishedAt=Date.now();
  S.exams.push({date:new Date().toLocaleString("zh-CN",{hour12:false}), label:ses.label, right, total, acc});
  if(S.exams.length>50) S.exams=S.exams.slice(-50);
  save(); go("examdone");
}

function heatHTML(){
  const weeks=[], now=new Date();
  const end=new Date(now); end.setDate(now.getDate()+ (6-now.getDay()) );
  const start=new Date(end); start.setDate(end.getDate()-83);
  const cur=new Date(start);
  while(cur<=end){
    const col=[];
    for(let r=0;r<7;r++){
      const k=cur.getFullYear()+"-"+String(cur.getMonth()+1).padStart(2,"0")+"-"+String(cur.getDate()).padStart(2,"0");
      const n=(S.daily[k]||{}).n||0;
      const lv=n>=40?4:n>=20?3:n>=10?2:n>=1?1:0;
      col.push(`<div class="cell ${lv?"l"+lv:""}" title="${k}：${n} 题"></div>`);
      cur.setDate(cur.getDate()+1);
    }
    weeks.push(`<div class="col">${col.join("")}</div>`);
  }
  return weeks.join("");
}

  list.forEach(raw=>{
    const q=normQ(raw);
    if(!q){ bad++; return; }
    if(cur.has(q.id)||builtIds.has(q.id)){ cur.set(q.id,q); upd++; }
    else { cur.set(q.id,q); add++; }
  });
  S.custom=[...cur.values()];
  save();
  return {add,upd,bad};
}
function importPack(text){
  let p;
  try{ p=JSON.parse(text); }catch(e){ return toast("JSON 解析失败，请检查格式"); }
  const list=(p&&p.type==="wtt-pack"&&Array.isArray(p.questions))?p.questions:(Array.isArray(p)?p:null);
  if(!list) return toast("不是有效的题库更新包（需 type:wtt-pack）");
  const res=mergePack(list);
  toast(`导入完成：新增 ${res.add} 题，覆盖更新 ${res.upd} 题${res.bad?`（${res.bad} 条格式无效已跳过）`:""}`);
  renderBank();
}
async function syncBank(manual){
  const r=S.settings.repo||{};
  const sources=[];
  if(r.custom) sources.push({url:r.custom,label:"自定义"});
  if(location.protocol.indexOf("http")===0) sources.push({url:"bank.json",label:"同源"});
  if(r.user&&r.repo){
    const br=r.branch||"main";
    sources.push({url:"https://fastly.jsdelivr.net/gh/"+r.user+"/"+r.repo+"@"+br+"/bank.json",label:"jsdelivr(fastly)"});
    sources.push({url:"https://cdn.jsdelivr.net/gh/"+r.user+"/"+r.repo+"@"+br+"/bank.json",label:"jsdelivr"});
    sources.push({url:"https://raw.githubusercontent.com/"+r.user+"/"+r.repo+"/"+br+"/bank.json",label:"GitHub raw"});
  }
  if(r.giteeUser&&r.repo) sources.push({url:"https://gitee.com/"+r.giteeUser+"/"+r.repo+"/raw/"+(r.branch||"main")+"/bank.json",label:"Gitee raw"});
  if(!sources.length) return {ok:false,msg:"未配置数据源"};
  for(const s of sources){
    try{
      const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),6000);
      const res=await fetch(s.url,{cache:"no-store",signal:ctl.signal}); clearTimeout(tm);
      if(!res.ok) continue;
      const pack=JSON.parse(await res.text());
      if(!pack||pack.type!=="wtt-pack"||!Array.isArray(pack.questions)||!pack.questions.length) continue;
      const same = S.sync && S.sync.version===String(pack.version||"");
      if(!same||manual) mergePack(pack.questions);
      S.sync={version:String(pack.version||"未标注"),at:Date.now(),source:s.label};
      save();
      return {ok:true,same,n:pack.questions.length,version:S.sync.version,source:s.label};
    }catch(e){ /* 试下一个源 */ }
  }
  return {ok:false,msg:"所有云端源均不可达"};
}

    <b>⚙ 数据源配置（填一次即可）</b>
    <div class="grid2" style="margin-top:10px">
      <div><p class="muted" style="margin-bottom:6px">GitHub 用户名</p><input type="text" id="rUser" placeholder="例如 zhangsan" value="${esc(r.user||"")}"></div>
      <div><p class="muted" style="margin-bottom:6px">仓库名</p><input type="text" id="rRepo" value="${esc(r.repo||"")}"></div>
      <div><p class="muted" style="margin-bottom:6px">分支</p><input type="text" id="rBranch" value="${esc(r.branch||"")}"></div>
      <div><p class="muted" style="margin-bottom:6px">Gitee 用户名（可选兜底）</p><input type="text" id="rGitee" placeholder="可选" value="${esc(r.giteeUser||"")}"></div>
    </div>
    <p class="muted" style="margin:10px 0 6px">自定义 JSON 地址（可选，最高优先，需支持跨域）</p>
    <input type="text" id="rCustom" placeholder="https://…/bank.json" value="${esc(r.custom||"")}">
    <div style="margin-top:12px"><button class="btn ghost" id="rSave">保存配置</button></div>
    <p class="muted" style="margin-top:8px">同步顺序：自定义 → 同源 bank.json → jsdelivr(fastly) → jsdelivr → GitHub raw → Gitee raw；任一成功即停，全部失败则继续用本地题库。</p>
  </div>

      <li>仓库页 → Add file → Upload files，把 <b>index.html</b> 和 <b>bank.json</b> 两个文件拖进去 → Commit changes</li>
      <li>Settings → Pages → Branch 选 <code>main</code> / root → Save，等 1-2 分钟生效</li>
      <li>手机浏览器打开 <code>https://用户名.github.io/ah-exam-bank/</code> 即可刷题；浏览器菜单选「添加到主屏幕」即得 App 图标</li>
      <li>回到本页填 GitHub 用户名 → 保存 → 立即同步，验证联通</li>
      <li><b>以后更新题库</b>：对 AI 说“更新时政题库”，拿到新 bank.json 后在 GitHub 仓库里替换该文件并提交；所有手机下次打开自动拉取最新</li>
    </ol>

  </div>`;
  $("#syNow").onclick=async()=>{ $("#syNow").textContent="同步中…"; const res=await syncBank(true);
    toast(res.ok?`✓ 同步成功：${res.version} · ${res.n} 题 · 来源 ${res.source}`:`✗ 同步失败：${res.msg}`);
    renderCloud(); };
  $("#syAuto").onchange=e=>{ r.auto=e.target.checked; save(); };
  $("#rSave").onclick=()=>{ r.user=$("#rUser").value.trim(); r.repo=$("#rRepo").value.trim()||"ah-exam-bank"; r.branch=$("#rBranch").value.trim()||"main"; r.giteeUser=$("#rGitee").value.trim(); r.custom=$("#rCustom").value.trim(); save(); toast("配置已保存"); };
}
function normQ(raw){
  if(!raw||typeof raw.q!=="string") return null;
  const o=Array.isArray(raw.o)?raw.o.map(String):null;
  if(!o||o.length<2) return null;
  let a=raw.a; if(typeof a==="string") a="ABCD".indexOf(a.toUpperCase());
  if(typeof a!=="number"||a<0||a>=o.length) a=0;
  const c=["ah","pl","sz","ls","yy","zt"].includes(raw.c)?raw.c:(raw.c==="other"?"ls":"sz");
  const id=String(raw.id||("C"+Date.now()+"-"+Math.random().toString(36).slice(2,6)));
  return {id, c, q:String(raw.q), o, a:Math.floor(a), e:raw.e?String(raw.e):"", s:raw.s?String(raw.s):"导入题", d:[1,2,3].includes(raw.d)?raw.d:2};
}
function download(name, text){
  const blob=new Blob([text],{type:"application/json;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);
  toast("已导出："+name);
}
function favBtnHtml(on){ return `<button class="favbtn ${on?"on":""}" id="favBtn" style="margin-left:auto">${on?"★ 已收藏":"☆ 收藏"}</button>`; }
function bindFavBtn(qid){
  const b=$("#favBtn"); if(!b) return;
  b.onclick=e=>{ e.stopPropagation();
    if(S.fav.includes(qid)){ S.fav=S.fav.filter(x=>x!==qid); b.classList.remove("on"); b.textContent="☆ 收藏"; }

    save();
  };
}

document.addEventListener("keydown",e=>{
  if(cur.name==="practicing"&&S.session){
    const ses=S.session, key=String(ses.qids[ses.idx]), q=byId(key.split("#")[0]);

    const map={"1":0,"2":1,"3":2,"4":3,"a":0,"b":1,"c":2,"d":3,"A":0,"B":1,"C":2,"D":3};

    if((e.key==="Enter"||e.key==="ArrowRight")&&ses.answers[key]!==undefined){ ses.idx++; save(); renderPracticeSession(); }
  }
});

/* ================= 启动 ================= */
(function boot(){
  if(S.session){
    if(S.session.kind==="exam"&&!S.session.result && S.session.deadline && Date.now()>S.session.deadline){ submitExam(true); return; }
    if(S.session.result){ go("examdone"); return; }
    go(S.session.kind==="exam"?"examining":"practicing");
  } else go("home");
  (async()=>{
    const r=S.settings.repo||{};
    if(r.auto===false) return;
    if(r.user||r.giteeUser||r.custom||location.protocol.indexOf("http")===0){
      const res=await syncBank(false);
      if(res.ok&&!res.same) toast("☁ 题库已同步："+res.version);
    }
  })();
})();
