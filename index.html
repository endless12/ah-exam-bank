<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>吾日三省 · 安徽省考常识刷题</title>
<style>
:root{
  --bg:#f5f2ec; --card:#ffffff; --ink:#1f2933; --sub:#52606d;
  --brand:#1d3557; --brand2:#457b9d; --brand-bg:#e8eef5; --gold:#b08d57;
  --ok:#2b8a3e; --ok-bg:#e9f7ec; --bad:#c92a2a; --bad-bg:#fdecec;
  --line:#e4ddd0; --soft:#f1ede4; --shadow:0 1px 3px rgba(31,41,51,.08);
}
[data-theme="dark"]{
  --bg:#14181d; --card:#1d232b; --ink:#e8e6e1; --sub:#9aa5b1;
  --brand:#8fb3d4; --brand2:#6a93b8; --brand-bg:#243040; --gold:#c9a86a;
  --ok:#4caf6d; --ok-bg:#1b2e22; --bad:#e05252; --bad-bg:#3a1f1f;
  --line:#2c3540; --soft:#232a33; --shadow:0 1px 3px rgba(0,0,0,.35);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;font-size:15px}
.serif{font-family:"Noto Serif SC","STSong","SimSun",serif}
button{font-family:inherit;cursor:pointer}
a{color:var(--brand2)}
/* header */
header{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.hwrap{max-width:920px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.seal{width:40px;height:40px;border-radius:8px;background:linear-gradient(135deg,#a02c2c,#7a1f1f);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;font-family:"Noto Serif SC","STKaiti","KaiTi",serif;font-weight:700;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25);flex:none}
.brand b{font-size:18px;letter-spacing:1px;font-family:"Noto Serif SC","STKaiti","KaiTi",serif}
.brand i{display:block;font-style:normal;font-size:11px;color:var(--sub);letter-spacing:.5px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:none;background:transparent;color:var(--sub);padding:7px 12px;border-radius:8px;font-size:14px}
nav button:hover{background:var(--soft);color:var(--ink)}
nav button.on{background:var(--brand-bg);color:var(--brand);font-weight:600}
#themeBtn{border:1px solid var(--line);background:var(--card);color:var(--sub);width:34px;height:34px;border-radius:8px;font-size:16px;flex:none}
main{max-width:920px;margin:0 auto;padding:20px 16px 60px}
footer{max-width:920px;margin:0 auto;padding:0 16px 30px;color:var(--sub);font-size:12px;text-align:center}
/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:10px;padding:10px 18px;font-size:14px;background:var(--brand);color:#fff;transition:.15s}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--soft)}
.btn.small{padding:6px 12px;font-size:13px;border-radius:8px}
.btn.danger{background:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
h2.vt{font-size:20px;margin:4px 0 14px;font-family:"Noto Serif SC","STKaiti","KaiTi",serif;letter-spacing:1px}
h2.vt small{font-size:12px;color:var(--sub);font-weight:400;margin-left:8px;letter-spacing:0}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--brand-bg);color:var(--brand);margin-right:6px;vertical-align:2px}
.tag.gold{background:rgba(176,141,87,.15);color:var(--gold)}
.muted{color:var(--sub);font-size:13px}
.hr{height:1px;background:var(--line);margin:14px 0}
/* home */
.hero{background:linear-gradient(120deg,var(--brand) 0%,var(--brand2) 100%);color:#fff;border-radius:16px;padding:26px 22px;margin-bottom:16px;position:relative;overflow:hidden}
.hero::after{content:"皖";position:absolute;right:-10px;bottom:-38px;font-size:160px;font-family:"Noto Serif SC","STKaiti","KaiTi",serif;opacity:.12;font-weight:700}
.hero h1{font-family:"Noto Serif SC","STKaiti","KaiTi",serif;font-size:24px;letter-spacing:2px;margin-bottom:6px}
.hero p{font-size:13px;opacity:.92;max-width:560px}
.hero .row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;position:relative;z-index:1}
.hero .btn{background:#fff;color:var(--brand);font-weight:600}
.hero .btn.ghost{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);color:#fff}
.statrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px;color:var(--brand);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--sub)}
.modcard{display:flex;flex-direction:column;gap:6px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:var(--shadow);cursor:pointer;transition:.15s;position:relative;overflow:hidden}
.modcard:hover{transform:translateY(-2px);border-color:var(--brand2)}
.modcard .ic{font-size:26px}
.modcard b{font-size:16px}
.modcard .meta{font-size:12px;color:var(--sub)}
.modbar{height:5px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:auto}
.modbar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand2),var(--brand));border-radius:99px}
/* practice / exam */
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.qnum{font-size:13px;color:var(--sub)}
.pbar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;margin:10px 0 16px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand2),var(--brand));transition:width .2s}
.qtext{font-size:17px;font-weight:600;line-height:1.75;margin-bottom:16px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;background:var(--card);cursor:pointer;text-align:left;font-size:15px;color:var(--ink);transition:.12s;line-height:1.6}
.opt:hover{border-color:var(--brand2)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--soft);color:var(--sub);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-top:1px}
.opt.sel{border-color:var(--brand);background:var(--brand-bg)}
.opt.sel .k{background:var(--brand);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.55;cursor:default}
.expl{margin-top:14px;border-radius:11px;padding:13px 15px;background:var(--soft);border-left:4px solid var(--brand2);font-size:14px}
.expl b{color:var(--brand)}
.qfoot{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
.favbtn{margin-left:auto;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-size:14px;color:var(--sub)}
.favbtn.on{color:var(--gold);border-color:var(--gold);background:rgba(176,141,87,.1)}
.sheet{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.sheet button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:12px}
.sheet button.cur{border-color:var(--brand);background:var(--brand);color:#fff}
.sheet button.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.sheet button.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.sheet button.ans{border-color:var(--brand2);color:var(--brand2);font-weight:700}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--bad);font-size:14px}
.timer.calm{color:var(--brand2)}
/* result */
.bigscore{text-align:center;padding:10px 0 4px}
.bigscore b{font-size:52px;color:var(--brand);font-family:"Noto Serif SC",serif}
.resbar{display:flex;gap:8px;margin:14px 0}
.resbar div{flex:1;height:10px;border-radius:99px;overflow:hidden;background:var(--soft)}
.resbar i{display:block;height:100%}
/* list */
.qlist{display:flex;flex-direction:column;gap:10px}
.qrow{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);cursor:pointer}
.qrow:hover{border-color:var(--brand2)}
.qrow .qt{font-weight:600;font-size:14.5px}
.qrow .qm{font-size:12px;color:var(--sub);margin-top:4px}
.qrow .qa{margin-top:8px;font-size:13.5px;color:var(--brand);background:var(--brand-bg);border-radius:8px;padding:8px 10px;display:none}
.qrow.open .qa{display:block}
.qrow .qa.wrongcount{color:var(--bad);background:var(--bad-bg)}
/* stats */
.bars{display:flex;flex-direction:column;gap:12px}
.brow{display:grid;grid-template-columns:90px 1fr 52px;gap:10px;align-items:center;font-size:13px}
.brow .track{height:12px;background:var(--soft);border-radius:99px;overflow:hidden}
.brow .track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand2),var(--brand))}
.heat{display:flex;gap:3px;overflow-x:auto;padding:4px 0}
.heat .col{display:flex;flex-direction:column;gap:3px}
.heat .cell{width:13px;height:13px;border-radius:3px;background:var(--soft)}
.heat .l1{background:#c5dce8}.heat .l2{background:#8fb3d0}.heat .l3{background:#5b8ab0}.heat .l4{background:#2d5f88}
/* bank & forms */
textarea,input[type="text"],select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:14px;background:var(--card);color:var(--ink);resize:vertical}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--brand2)}
label.ck{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--sub);padding:6px 14px;border-radius:99px;font-size:13px}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
/* modal & toast */
#modal{position:fixed;inset:0;background:rgba(20,25,32,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
#modal.show{display:flex}
#modal .box{background:var(--card);border-radius:14px;padding:22px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#modal h3{margin-bottom:10px;font-size:16px}
#modal p{font-size:14px;color:var(--sub);margin-bottom:18px;white-space:pre-line}
#modal .row{display:flex;gap:10px;justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;z-index:120;pointer-events:none;max-width:86vw;text-align:center}
#toast.show{opacity:1}
@media (max-width:640px){
  .hwrap{padding:8px 12px;gap:8px}
  nav{width:100%;order:3;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}
  nav button{padding:6px 10px;font-size:13px;white-space:nowrap}
  main{padding:14px 12px 50px}
  .qtext{font-size:16px}
  .hero{padding:20px 16px}
  .hero h1{font-size:20px}
}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand">
      <span class="seal">皖</span>
      <div><b>吾日三省</b><i>安徽省考 · 每日一省 时常自新</i></div>
    </div>
    <nav id="nav"></nav>
    <button id="themeBtn" title="切换深浅色">🌙</button>
  </div>
</header>
<main id="app"></main>
<footer id="foot"></footer>
<div id="modal"><div class="box"><h3 id="mTitle"></h3><p id="mBody"></p><div class="row"><button class="btn ghost small" id="mNo">取消</button><button class="btn small" id="mYes">确定</button></div></div></div>
<div id="toast"></div>
<script>
/* ================= 题库（内置，支持导入更新包） ================= */
const BANK_VERSION = "v1.3（2026-11-05）";
const QUESTIONS = [
{id:"AH001",c:"ah",q:"安徽省的简称“皖”源于历史上的（　）。",o:["古皖国与皖山（天柱山）","皖南山区","皖河流域的航运传统","清代的皖江道"],a:0,e:"安徽简称“皖”，源于春秋时期的古皖国（今安庆潜山一带）。境内天柱山古称皖山、皖公山，皖河由此流经。“皖”意为洁白美好。",s:"省情基础",d:1},
{id:"AH002",c:"ah",q:"“安徽”省名取自下列哪两个历史府名的首字？（　）",o:["安庆、徽州","合肥、黄山","宣城、池州","芜湖、寿州"],a:0,e:"清康熙六年（1667年）建省，取安庆府、徽州府二府首字合称“安徽”。安庆为清代安徽省会，徽州是徽文化发源地。",s:"省情基础",d:1},
{id:"AH003",c:"ah",q:"安徽省现辖地级市的数量是（　）。",o:["14个","15个","16个","17个"],a:2,e:"安徽现辖16个地级市：合肥、淮北、亳州、宿州、蚌埠、阜阳、淮南、滁州、六安、马鞍山、芜湖、宣城、铜陵、池州、安庆、黄山。2011年撤销地级巢湖市后形成现格局。",s:"省情基础",d:1},
{id:"AH004",c:"ah",q:"下列全部属于皖北地区的一组城市是（　）。",o:["蚌埠、阜阳、亳州","芜湖、马鞍山、铜陵","黄山、宣城、池州","安庆、六安、滁州"],a:0,e:"习惯上以淮河、长江划分：皖北（淮河以北）包括淮北、亳州、宿州、蚌埠、阜阳、淮南；皖南（长江以南）包括芜湖、马鞍山、铜陵、宣城、池州、黄山；其余为皖中、皖西（大别山区）。",s:"省情地理",d:1},
{id:"AH005",c:"ah",q:"合肥的古称是（　）。",o:["庐州","颍州","寿州","滁州"],a:0,e:"合肥古称庐州、庐阳，因东淝河与南淝河交汇于此而得名“合肥”。素有“三国故地、包拯故里、淮军摇篮”之称。",s:"省情基础",d:1},
{id:"AH006",c:"ah",q:"清代安徽的省会是（　）。",o:["合肥","安庆","芜湖","蚌埠"],a:1,e:"清代安徽省会长驻安庆。民国及新中国成立初期曾设皖北、皖南行署区，1952年恢复安徽省建制后正式定省会于合肥。",s:"省情历史",d:2},
{id:"AH007",c:"ah",q:"下列省份中，与安徽不接壤的是（　）。",o:["山东","河南","湖北","浙江"],a:0,e:"安徽与河南（西北）、江苏（东）、浙江（东南）、江西（南）、湖北（西南）五省接壤，地处华东，承东启西、连南接北，但与山东不接壤。",s:"省情地理",d:2},
{id:"AH008",c:"ah",q:"秦岭—淮河一线是我国南北地理分界线。安徽地处该分界线上、淮河穿城而过并别称“珠城”的城市是（　）。",o:["淮南","蚌埠","阜阳","宿州"],a:1,e:"蚌埠地处淮河中游，古乃采珠之地，别称“珠城”，正处南北分界带上，素有“禹会诸侯地、淮上明珠城”之称。",s:"省情地理",d:2},
{id:"AH009",c:"ah",q:"中国五大淡水湖中位于安徽、现为合肥“内湖”的是（　）。",o:["太平湖","升金湖","巢湖","城西湖"],a:2,e:"巢湖为我国五大淡水湖之一（其余为鄱阳湖、洞庭湖、太湖、洪泽湖），是安徽最大湖泊。2011年行政区划调整后成为合肥市的“内湖”。",s:"省情地理",d:1},
{id:"AH010",c:"ah",q:"黄山于1990年被联合国教科文组织列入《世界遗产名录》，其遗产类型是（　）。",o:["世界自然遗产","世界文化遗产","世界文化与自然双重遗产","世界记忆遗产"],a:2,e:"黄山1990年列入世界文化与自然双重遗产，是我国继泰山之后的第二处双遗产。黄山以“五绝”著称：奇松、怪石、云海、温泉、冬雪。",s:"省情文化",d:1},
{id:"AH011",c:"ah",q:"皖南古村落西递、宏村列入《世界文化遗产名录》的时间是（　）。",o:["1990年","2000年","2010年","2020年"],a:1,e:"2000年，西递、宏村作为“皖南古村落”列入世界文化遗产，是徽派建筑、徽文化的活态博物馆。安徽现有黄山、皖南古村落两处世界遗产（另有淮北柳孜运河遗址属大运河世界遗产点）。",s:"省情文化",d:2},
{id:"AH012",c:"ah",q:"九华山是中国佛教四大名山之一，它是（　）的道场。",o:["文殊菩萨","观音菩萨","地藏菩萨","普贤菩萨"],a:2,e:"九华山（池州青阳县）为地藏菩萨道场。四大佛教名山：五台山——文殊、峨眉山——普贤、普陀山——观音、九华山——地藏。",s:"省情文化",d:1},
{id:"AH013",c:"ah",q:"下列名山中，不属于中国四大道教名山的是（　）。",o:["武当山","龙虎山","齐云山","九华山"],a:3,e:"中国四大道教名山：湖北武当山、江西龙虎山、安徽齐云山（黄山休宁）、四川青城山。九华山是佛教名山。",s:"省情文化",d:2},
{id:"AH014",c:"ah",q:"天柱山古称“皖山”“皖公山”，汉武帝时曾封其为（　）。",o:["东岳","南岳","西岳","中岳"],a:1,e:"天柱山（安庆潜山）古称皖山，汉武帝南巡时封为“南岳”（古南岳），隋文帝后改封湖南衡山。天柱山现为世界地质公园。",s:"省情文化",d:2},
{id:"AH015",c:"ah",q:"2024年安徽省地区生产总值突破（　）万亿元大关。",o:["4","5","6","7"],a:1,e:"2024年安徽GDP达50625亿元、同比增长5.8%，跻身全国“5万亿元俱乐部”（列全国第11位左右）。“十四五”期间安徽连跨4万亿（2021）、5万亿（2024）两个台阶。",s:"省情经济·2024数据",d:1},
{id:"AH016",c:"ah",q:"“十四五”期间，安徽经济总量先后迈上的两个万亿元台阶是（　）。",o:["2万亿、3万亿","3万亿、4万亿","4万亿、5万亿","5万亿、6万亿"],a:2,e:"安徽GDP于2014年破2万亿、2018年破3万亿、2021年破4万亿、2024年破5万亿，自2009年跻身万亿俱乐部后连续迈过四个万亿大关。",s:"省情经济",d:2},
{id:"AH017",c:"ah",q:"“十四五”时期，安徽的汽车与新能源汽车产量在全国所处的位次是（　）。",o:["全国第一","全国第二","全国第三","全国第五"],a:0,e:"“十四五”时期安徽汽车与新能源汽车产量位居全国第一（2025年一季度汽车产量和出口量双双登顶全国第一），安徽将汽车产业作为“首位产业”。",s:"省情经济·最新",d:1},
{id:"AH018",c:"ah",q:"合肥综合性国家科学中心获批于2017年，它是全国第（　）个、中西部首个综合性国家科学中心。",o:["一","二","三","四"],a:1,e:"2017年1月国家批复建设合肥综合性国家科学中心，为全国第二个（首个为上海张江）、中西部第一个，标志着合肥进入国家创新体系顶层布局。",s:"省情科技",d:1},
{id:"AH019",c:"ah",q:"被誉为“人造太阳”、多次刷新世界纪录的全超导托卡马克核聚变实验装置（EAST），位于合肥的（　）。",o:["科学岛","滨湖科学城","高新区","新站区"],a:0,e:"EAST装置位于合肥西郊董铺水库的“科学岛”（中科院合肥物质科学研究院），是实现可控核聚变研究的大科学装置，多次创造高约束模式运行世界纪录。",s:"省情科技",d:2},
{id:"AH020",c:"ah",q:"中国科学技术大学1969年开始南迁，1970年落户的城市是（　）。",o:["上海","合肥","武汉","南京"],a:1,e:"中国科大1958年创办于北京，1970年整体南迁合肥。科大与合肥“名城养名校、名校反哺名城”，孕育了合肥的科教基因。",s:"省情科教",d:2},
{id:"AH021",c:"ah",q:"世界首颗量子科学实验卫星“墨子号”和世界首条量子保密通信干线“京沪干线”均与合肥的科研力量密切相关，其核心团队来自（　）。",o:["中国科学技术大学","合肥工业大学","安徽大学","中科院安徽光机所"],a:0,e:"中科大潘建伟院士团队牵头研制“墨子号”量子卫星（2016年发射）和“京沪干线”（2017年开通，全长约2000公里），合肥已成为全国量子科技“高地”。",s:"省情科技",d:2},
{id:"AH022",c:"ah",q:"习近平总书记为安徽擘画的“三地一区”战略定位，不包括下列哪一项？（　）",o:["全国科技创新策源地","新兴产业聚集地","改革开放新高地","现代农业示范先行区"],a:3,e:"“三地一区”指全国科技创新策源地、新兴产业聚集地、改革开放新高地、经济社会发展全面绿色转型区。2024年10月习近平总书记考察安徽时要求安徽推动“三地一区”建设实现新突破。",s:"省情战略·最新",d:1},
{id:"AH023",c:"ah",q:"沟通长江、淮河两大水系，安徽迄今投资规模最大的跨流域调水工程是（　）。",o:["淠史杭工程","引江济淮工程","茨淮新河工程","怀洪新河工程"],a:1,e:"引江济淮工程2022年试通水通航，沟通长江—巢湖—淮河，润泽皖豫两省，兼具供水、航运、生态功能，是安徽融入长江经济带与淮河生态经济带的标志性工程。",s:"省情水利",d:2},
{id:"AH024",c:"ah",q:"全国首个跨省流域生态补偿机制试点，发生在安徽与（　）之间。",o:["江苏","浙江","江西","湖北"],a:1,e:"新安江流域生态补偿机制（2012年起，皖浙两省）是全国首个跨省流域生态补偿试点，被称为“新安江模式”，为全国流域横向生态补偿提供了范本。",s:"省情生态",d:2},
{id:"AH025",c:"ah",q:"中国（安徽）自由贸易试验区于2020年9月设立，其片区构成是（　）。",o:["合肥、芜湖、蚌埠三个片区","合肥、马鞍山、铜陵三个片区","全省全域","仅合肥一个片区"],a:0,e:"2020年9月安徽自贸试验区揭牌，含合肥、芜湖、蚌埠三个片区，分别主打科创、开放枢纽、高端制造，是安徽打造改革开放新高地的重要平台。",s:"省情开放",d:2},
{id:"AH026",c:"ah",q:"2019年《长江三角洲区域一体化发展规划纲要》公布后，安徽在长三角一体化中的定位是（　）。",o:["仅部分县市纳入","全省域纳入长三角一体化发展","仅作为观察员","仅参与生态协作"],a:1,e:"规划纲要明确安徽全省域纳入长三角一体化发展（苏浙皖沪“三省一市”），安徽成为长三角的重要组成部分，承东启西的区位优势充分释放。",s:"省情战略",d:2},
{id:"AH027",c:"ah",q:"文房四宝中，宣纸、宣笔、徽墨、歙砚的主要产地均在安徽。被称为“中国文房四宝之城”的安徽城市是（　）。",o:["歙县","泾县","宣城","屯溪"],a:2,e:"宣城是中国唯一的“文房四宝之城”：宣纸主产于泾县、宣笔产于宣城、徽墨与歙砚主产于歙县。有“中国文房四宝，安徽取其半”之誉。",s:"省情文化",d:1},
{id:"AH028",c:"ah",q:"宣纸“纸寿千年、墨韵万变”，其传统制作技艺入选人类非物质文化遗产名录的时间是（　）。",o:["2006年","2009年","2014年","2019年"],a:1,e:"2009年“宣纸传统制作技艺”入选联合国教科文组织人类非遗代表作名录。宣纸产于泾县，以青檀树皮和沙田稻草为原料，工序上百道。",s:"省情文化",d:2},
{id:"AH029",c:"ah",q:"中国四大名砚不包括（　）。",o:["端砚","歙砚","洮砚","松花砚"],a:3,e:"四大名砚为广东端砚、安徽歙砚、甘肃洮砚、山西（河南）澄泥砚。歙砚产于古歙州（今江西婺源及安徽歙县一带），石质细腻，发墨益毫。",s:"省情文化",d:2},
{id:"AH030",c:"ah",q:"黄梅戏的经典剧目是（　）。",o:["《天仙配》《女驸马》","《贵妃醉酒》《霸王别姬》","《花为媒》《杨三姐告状》","《牡丹亭》《长生殿》"],a:0,e:"《天仙配》《女驸马》《打猪草》《牛郎织女》均为黄梅戏经典。黄梅戏源自湖北黄梅采茶调，成长壮大于安徽安庆，是安徽主要地方剧种。",s:"省情文化",d:1},
{id:"AH031",c:"ah",q:"黄梅戏表演艺术大师、被誉为“黄梅戏一代宗师”的安徽人是（　）。",o:["严凤英","新凤霞","红线女","常香玉"],a:0,e:"严凤英（安庆桐城罗岭人）主演的《天仙配》（1955年电影）让黄梅戏风靡全国。新凤霞为评剧、红线女为粤剧、常香玉为豫剧名家。",s:"省情文化",d:2},
{id:"AH032",c:"ah",q:"徽剧是京剧形成的重要源头。“四大徽班进京”发生在乾隆五十五年（1790年），四大徽班是指（　）。",o:["三庆、四喜、春台、和春","三庆、四喜、富连成、和春","庆升、翠花、三庆、四喜","春台、和春、嵩祝、双庆"],a:0,e:"1790年为乾隆帝八十大寿，三庆、四喜、春台、和春四大徽班相继进京，徽汉合流、兼收昆秦，最终孕育出国粹京剧。",s:"省情文化",d:2},
{id:"AH033",c:"ah",q:"徽商是明清时期最重要的商帮之一，其“贾而好儒”的传统主要经营范围通常概括为（　）。",o:["盐、典、茶、木","丝、瓷、茶、药","粮、棉、布、油","铜、铁、锡、煤"],a:0,e:"徽商以经营盐、典当、茶叶、木材四大行业为主，讲究“贾为厚利、儒为名高”，“无徽不成镇”道尽其商业影响。",s:"省情文化",d:2},
{id:"AH034",c:"ah",q:"徽派建筑中，具有防火隔断功能、已成为徽派建筑标志性符号的构件是（　）。",o:["马头墙","抄手游廊","美人靠","藻井"],a:0,e:"马头墙又称封火墙，层层跌落形似马头，可阻隔火势蔓延，与粉墙黛瓦、天井合称徽派建筑典型特征。徽州“三雕”（木雕、石雕、砖雕）亦极负盛名。",s:"省情文化",d:1},
{id:"AH035",c:"ah",q:"徽州一府六县中，今已划属江西省的是（　）。",o:["歙县","休宁","婺源","祁门"],a:2,e:"古徽州一府六县：歙县、黟县、休宁、祁门、绩溪、婺源。婺源1934年后几经变动，今属江西上饶；绩溪今属宣城，其余属黄山市。徽州文化生态保护区为全国首个跨省文化生态保护区。",s:"省情文化",d:3},
{id:"AH036",c:"ah",q:"清代最大的散文流派“桐城派”的集大成者是（　）。",o:["方苞","刘大櫆","姚鼐","吴敬梓"],a:2,e:"桐城派以“义法”论文：方苞开创、刘大櫆承上启下、姚鼐集大成（著《登泰山记》，提出义理、考据、辞章合一）。吴敬梓为《儒林外史》作者，非桐城派。",s:"省情文化",d:2},
{id:"AH037",c:"ah",q:"“一纸书来只为墙，让他三尺又何妨”的“六尺巷”佳话，发生在安徽（　）。",o:["桐城市","歙县","绩溪县","寿县"],a:0,e:"六尺巷在桐城，源于清康熙大学士张英家人的宅基地之争，张英一诗化解，两家各退三尺成巷。2024年10月习近平总书记考察安徽时曾到访六尺巷。",s:"省情文化·最新",d:1},
{id:"AH038",c:"ah",q:"奇瑞汽车的总部所在城市是（　）。",o:["合肥","芜湖","马鞍山","滁州"],a:1,e:"奇瑞总部在芜湖，为安徽汽车工业的代表；合肥则聚集了江淮、蔚来中国总部、大众安徽、比亚迪合肥基地等，“双城联动”撑起安徽汽车“首位产业”。",s:"省情经济",d:1},
{id:"AH039",c:"ah",q:"李白一生多次游历安徽，最终长眠于当涂青山。下列安徽名胜与李白诗句对应正确的是（　）。",o:["天门山——“两岸青山相对出”","敬亭山——“两岸青山相对出”","采石矶——“相看两不厌”","桃花潭——“孤帆一片日边来”"],a:0,e:"《望天门山》“两岸青山相对出，孤帆一片日边来”写芜湖天门山；《独坐敬亭山》“相看两不厌，只有敬亭山”写宣城敬亭山；《赠汪伦》“桃花潭水深千尺”写泾县桃花潭；李白墓在当涂青山，采石矶有捉月传说。",s:"省情文化",d:2},
{id:"AH040",c:"ah",q:"欧阳修名篇《醉翁亭记》所写的醉翁亭，位于今安徽（　）。",o:["滁州琅琊山","宣城敬亭山","池州齐山","舒城万佛湖"],a:0,e:"《醉翁亭记》开篇“环滁皆山也”，醉翁亭在滁州琅琊山，为北宋僧人智仙所建、欧阳修命名，“醉翁之意不在酒”由此而来。",s:"省情文化",d:1},
{id:"AH041",c:"ah",q:"刘禹锡《陋室铭》作于其任和州刺史期间，“和州”即今安徽（　）。",o:["和县","含山县","当涂县","无为市"],a:0,e:"《陋室铭》“山不在高，有仙则名”写于和州（今马鞍山和县）任上。白居易《琵琶行》写于江州（九江），注意区分。",s:"省情文化",d:2},
{id:"AH042",c:"ah",q:"杜牧任池州刺史期间写下“清明时节雨纷纷，路上行人欲断魂”，诗中的杏花村在今安徽（　）。",o:["池州","亳州","六安","宿州"],a:0,e:"《清明》作于池州任上，池州杏花村由此闻名。此外杜牧还写过和州乌江《题乌江亭》“胜败兵家事不期”。",s:"省情文化",d:2},
{id:"AH043",c:"ah",q:"淮南被誉为豆腐的发源地，相传豆腐的发明与（　）有关。",o:["西汉淮南王刘安","东汉神医华佗","明太祖朱元璋","清儒戴震"],a:0,e:"相传西汉淮南王刘安在八公山炼丹时以黄豆浆凝成豆腐，淮南因此被视为豆腐发源地。刘安还主持编撰了《淮南子》。",s:"省情文化",d:1},
{id:"AH044",c:"ah",q:"被誉为“中华药都”、拥有全国最大中药材交易市场的安徽城市是（　）。",o:["亳州","阜阳","宿州","蚌埠"],a:0,e:"亳州是华佗故里，中药材种植与交易历史悠久，建有全国规模领先的康美（亳州）华佗国际中药城，被称为“中华药都”。",s:"省情经济",d:1},
{id:"AH045",c:"ah",q:"1978年冬，全国农村改革“大包干”的源头是（　）。",o:["凤阳县小岗村","肥西县小井庄","当涂县圩区","涡阳县义门镇"],a:0,e:"1978年11月，凤阳小岗村18户农民按下红手印搞“大包干”，拉开中国农村改革大幕，“敢为人先”的小岗精神由此载入史册。肥西小井庄同期亦有包产到户探索。",s:"省情历史",d:1},
{id:"AH046",c:"ah",q:"被誉为“红军的摇篮、将军的故乡”的安徽县份是（　）。",o:["金寨县","岳西县","霍山县","泾县"],a:0,e:"金寨县是大别山革命老区核心，先后组建了11支主力红军队伍，走出洪学智等59位开国将军，被誉为“红军的摇篮、将军的故乡”。",s:"省情历史",d:2},
{id:"AH047",c:"ah",q:"1941年1月震惊中外的“皖南事变”发生地是安徽（　）。",o:["泾县茂林","歙县雄村","休宁屯溪","宣城水东"],a:0,e:"1941年1月，新四军军部及所属部队9000余人在泾县茂林地区遭国民党军伏击，叶挺被扣、项英遇难。周恩来在重庆《新华日报》题写“千古奇冤，江南一叶；同室操戈，相煎何急”。",s:"省情历史",d:2},
{id:"AH048",c:"ah",q:"1949年4月渡江战役总前委旧址所在地是（　）。",o:["合肥肥东瑶岗","南京总统府","徐州贾汪","蚌埠孙家圩子"],a:0,e:"渡江战役总前委（邓小平、陈毅等）指挥机关驻合肥肥东瑶岗村，指挥百万雄师过大江。蚌埠孙家圩子为渡江战役前华东局、总前委另一驻地（1949年3月）。",s:"省情历史",d:3},
{id:"AH049",c:"ah",q:"淮海战役中歼灭黄维兵团的关键战斗“双堆集歼灭战”，发生在今安徽（　）。",o:["濉溪县","灵璧县","萧县","涡阳县"],a:0,e:"1948年11月至12月，中原野战军在濉溪双堆集地区围歼国民党黄维兵团，为淮海战役胜利奠定关键基础。淮海战役总前委书记为邓小平。",s:"省情历史",d:3},
{id:"AH050",c:"ah",q:"被称为“千里淮河第一闸”、体现“舍小家为大家”精神的是（　）。",o:["王家坝闸","蚌埠闸","三河闸","万福闸"],a:0,e:"王家坝闸位于阜阳市阜南县，是淮河干流重要控制闸，蒙洼蓄洪区16次开闸蓄洪，“王家坝精神”成为安徽人民奉献精神的象征。",s:"省情地理",d:2},
{id:"AH051",c:"ah",q:"安徽是我国粮食主产省，粮食产量常年稳定在800亿斤以上，位居全国前列。安徽粮食主产区主要分布在（　）。",o:["淮北平原","皖南山区","大别山区","沿江圩区"],a:0,e:"皖北淮北平原地势平坦、土壤肥沃，是安徽粮仓；全省粮食产量常年居全国第4位左右，为国家粮食安全作出重要贡献。",s:"省情经济",d:2},
{id:"AH052",c:"ah",q:"被誉为“红茶皇后”，与印度大吉岭红茶、斯里兰卡乌瓦红茶并称世界三大高香红茶的是（　）。",o:["黄山毛峰","祁门红茶","六安瓜片","太平猴魁"],a:1,e:"祁门红茶产自黄山祁门县，似花似果似蜜的“祁门香”享誉世界。安徽四大名茶：黄山毛峰、六安瓜片、太平猴魁、祁门红茶。",s:"省情物产",d:1},
{id:"AH053",c:"ah",q:"徽菜是我国八大菜系之一，其代表性名菜是（　）。",o:["臭鳜鱼、毛豆腐","佛跳墙、荔枝肉","东安子鸡、组庵鱼翅","九转大肠、糖醋鲤鱼"],a:0,e:"徽菜重油、重色、重火功，名菜有臭鳜鱼、毛豆腐、胡适一品锅等。八大菜系：鲁、川、粤、苏、闽、浙、湘、徽。",s:"省情文化",d:1},
{id:"AH054",c:"ah",q:"被誉为“东方芭蕾”的安徽民间舞蹈艺术是（　）。",o:["花鼓灯","凤阳花鼓","傩舞","狮子舞"],a:0,e:"花鼓灯流行于蚌埠、淮南淮河两岸，集歌、舞、锣鼓演奏于一体，刚劲矫健，被誉为“东方芭蕾”，入选首批国家级非遗。",s:"省情文化",d:2},
{id:"AH055",c:"ah",q:"安徽四大地方戏曲剧种通常指（　）。",o:["黄梅戏、徽剧、庐剧、泗州戏","黄梅戏、越剧、豫剧、庐剧","徽剧、京剧、庐剧、黄梅戏","黄梅戏、花鼓戏、傩戏、徽剧"],a:0,e:"安徽四大剧种：黄梅戏（安庆）、徽剧（孕育京剧）、庐剧（皖中）、泗州戏（淮北，俗称“拉魂腔”）。",s:"省情文化",d:2},
{id:"AH056",c:"ah",q:"2025年前三季度，安徽规模以上工业增加值同比增长8.8%，增速位居全国第（　），同时领跑长三角和中部地区。",o:["一","二","四","六"],a:2,e:"2025年前三季度安徽规上工业增加值增速8.8%，居全国第四、长三角和中部第一；规上工业营收总量跻身全国第六、中西部第一，实现从“传统农业大省”向“新兴工业大省”的历史性跨越。",s:"省情经济·最新",d:2},
{id:"AH057",c:"ah",q:"安徽着力打造的“大黄山”世界级休闲度假康养旅游目的地，联动的主要城市不包括（　）。",o:["黄山","池州","宣城","阜阳"],a:3,e:"“大黄山”涵盖黄山、池州、宣城、安庆四市，是皖南国际文化旅游示范区核心区，主打生态型国际化世界级旅游目的地。",s:"省情战略·最新",d:2},
{id:"AH058",c:"ah",q:"被称为“中国古铜都”、采冶铜历史绵延三千余年的安徽城市是（　）。",o:["铜陵","马鞍山","芜湖","淮南"],a:0,e:"铜陵因铜得名、以铜兴市，青铜采冶史可上溯至商周，是“中国古铜都”。马鞍山为“钢城”（马钢），淮南为“煤电之都”。",s:"省情经济",d:1},
{id:"AH059",c:"ah",q:"李白墓葬于安徽当涂青山。当涂采石矶与下列哪两处并称“长江三矶”？（　）",o:["城陵矶、燕子矶","赤壁、白帝城","黄鹤矶、观音矶","小孤山、板子矶"],a:0,e:"“长江三矶”：湖南城陵矶、安徽采石矶、南京燕子矶。采石矶峭壁临江，相传李白在此跳江捉月骑鲸升天。",s:"省情文化",d:3},
{id:"AH060",c:"ah",q:"中国四大古城中，位于安徽的是（　）。",o:["徽州古城","平遥古城","阆中古城","丽江古城"],a:0,e:"中国四大古城：安徽徽州古城（歙县）、山西平遥古城、四川阆中古城、云南丽江古城。徽州古城为历代徽州府治所在地。",s:"省情文化",d:1},

{id:"PL001",c:"pl",q:"习近平新时代中国特色社会主义思想的核心内容包括“十个明确”“十四个坚持”“十三个方面成就”。其中，作为新时代坚持和发展中国特色社会主义基本方略的是（　）。",o:["十个明确","十四个坚持","十三个方面成就","两个结合"],a:1,e:"“十个明确”是核心内容（思想要义），“十四个坚持”是基本方略（实践要求），“十三个方面成就”是实践成果概括。此为十九届六中全会《决议》的权威概括。",s:"政治理论·新思想",d:2},
{id:"PL002",c:"pl",q:"党的十九届六中全会提出的“两个确立”是指（　）。",o:["确立习近平同志党中央的核心、全党的核心地位，确立习近平新时代中国特色社会主义思想的指导地位","确立党对一切工作的领导，确立以经济建设为中心","确立道路自信，确立制度自信","确立改革开放，确立依法治国"],a:0,e:"“两个确立”是党的十九届六中全会《决议》作出的重大政治论断，是新时代最重要的政治成果，是“四个意识”“四个自信”“两个维护”的集中体现。",s:"政治理论·新思想",d:1},
{id:"PL003",c:"pl",q:"“四个意识”是指政治意识、大局意识、核心意识和（　）。",o:["纪律意识","看齐意识","责任意识","服务意识"],a:1,e:"四个意识：政治意识、大局意识、核心意识、看齐意识。四个自信：道路、理论、制度、文化自信。两个维护：坚决维护习近平总书记党中央的核心、全党的核心地位，坚决维护党中央权威和集中统一领导。",s:"政治理论·新思想",d:1},
{id:"PL004",c:"pl",q:"“四个自信”中，习近平总书记称之为“更基础、更广泛、更深厚的自信”的是（　）。",o:["道路自信","理论自信","制度自信","文化自信"],a:3,e:"文化自信是更基础、更广泛、更深厚的自信，是一个国家、一个民族发展中更基本、更深沉、更持久的力量。",s:"政治理论·新思想",d:2},
{id:"PL005",c:"pl",q:"党的二十大报告指出，中国式现代化的中国特色不包括（　）。",o:["人口规模巨大的现代化","全体人民共同富裕的现代化","物质文明和精神文明相协调的现代化","信息化和城镇化深度融合的现代化"],a:3,e:"中国式现代化五大特征：人口规模巨大、全体人民共同富裕、物质文明和精神文明相协调、人与自然和谐共生、走和平发展道路的现代化。",s:"政治理论·二十大",d:1},
{id:"PL006",c:"pl",q:"中国式现代化的本质要求中，居于首位、最根本的是（　）。",o:["坚持高质量发展","坚持中国共产党领导","发展全过程人民民主","实现全体人民共同富裕"],a:1,e:"中国式现代化的本质要求共9条，第一条即坚持中国共产党领导，第二条为坚持中国特色社会主义——这是区别于西方现代化的根本规定。",s:"政治理论·二十大",d:2},
{id:"PL007",c:"pl",q:"党的二十大报告提出，（　）是全面建设社会主义现代化国家的首要任务。",o:["高质量发展","科技创新","共同富裕","乡村振兴"],a:0,e:"发展是党执政兴国的第一要务，高质量发展是全面建设社会主义现代化国家的首要任务。教育、科技、人才是全面建设社会主义现代化国家的基础性、战略性支撑。",s:"政治理论·二十大",d:1},
{id:"PL008",c:"pl",q:"党的二十大报告首次将（　）进行统筹部署、一体推进。",o:["教育、科技、人才","改革、发展、稳定","人口、资源、环境","创新、协调、绿色"],a:0,e:"二十大首次把教育、科技、人才三大战略一体部署，强调教育强国、科技强国、人才强国建设，凸显创新在现代化全局中的核心地位。",s:"政治理论·二十大",d:2},
{id:"PL009",c:"pl",q:"党的二十大提出的“三个务必”是指务必不忘初心、牢记使命，务必谦虚谨慎、艰苦奋斗，务必（　）。",o:["敢于斗争、善于斗争","自信自强、守正创新","踔厉奋发、勇毅前行","独立自主、自立自强"],a:0,e:"“三个务必”是二十大对全党的要求：务必不忘初心、牢记使命；务必谦虚谨慎、艰苦奋斗；务必敢于斗争、善于斗争。",s:"政治理论·二十大",d:2},
{id:"PL010",c:"pl",q:"新发展理念中，解决我国发展不平衡不充分问题、增强发展整体性协调性的是（　）。",o:["创新发展","协调发展","绿色发展","共享发展"],a:1,e:"创新发展注重解决发展动力问题，协调发展注重解决发展不平衡问题，绿色发展解决人与自然和谐问题，开放发展解决内外联动问题，共享发展解决社会公平正义问题。",s:"政治理论·新思想",d:1},
{id:"PL011",c:"pl",q:"我国构建的新发展格局是指（　）。",o:["以国内大循环为主体、国内国际双循环相互促进","以国际大循环为主体、国内国际双循环相互促进","以内需为主、外贸为辅的单一循环","城乡一体、区域协调的发展格局"],a:0,e:"构建以国内大循环为主体、国内国际双循环相互促进的新发展格局，是把握发展主动权的先手棋，不是封闭的国内循环，而是更加开放的国内国际双循环。",s:"政治理论·新思想",d:1},
{id:"PL012",c:"pl",q:"新时代我国社会主要矛盾是（　）。",o:["人民日益增长的物质文化需要同落后的社会生产之间的矛盾","人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾","发展与生态保护之间的矛盾","效率与公平之间的矛盾"],a:1,e:"十九大作出重大政治判断：我国社会主要矛盾已转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾，但我国仍处于并将长期处于社会主义初级阶段的基本国情没有变。",s:"政治理论·新思想",d:1},
{id:"PL013",c:"pl",q:"中国特色社会主义事业“五位一体”总体布局是指经济建设、政治建设、文化建设、社会建设和（　）。",o:["生态文明建设","党的建设","国防建设","法治建设"],a:0,e:"“五位一体”总体布局：经济、政治、文化、社会、生态文明建设；“四个全面”战略布局：全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党。",s:"政治理论·新思想",d:1},
{id:"PL014",c:"pl",q:"党的二十大之后，“四个全面”战略布局中作出更新调整的内容是（　）。",o:["将“全面建成小康社会”更新为“全面建设社会主义现代化国家”","将“全面深化改革”更新为“全面扩大开放”","将“全面从严治党”更新为“全面从高治党”","将“全面依法治国”更新为“全面依宪治国”"],a:0,e:"二十大后将“四个全面”表述更新为：全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党。",s:"政治理论·二十大",d:2},
{id:"PL015",c:"pl",q:"总体国家安全观强调以人民安全为（　）、以政治安全为（　）。",o:["宗旨；根本","根本；宗旨","基础；保障","保障；基础"],a:0,e:"总体国家安全观：以人民安全为宗旨、以政治安全为根本、以经济安全为基础、以军事科技文化社会安全为保障、以促进国际安全为依托。",s:"政治理论·新思想",d:2},
{id:"PL016",c:"pl",q:"伟大建党精神的内涵是（　）。",o:["坚持真理、坚守理想，践行初心、担当使命，不怕牺牲、英勇斗争，对党忠诚、不负人民","爱岗敬业、诚实守信，艰苦奋斗、无私奉献","自力更生、发愤图强，解放思想、锐意进取","自信自强、守正创新，踔厉奋发、勇毅前行"],a:0,e:"伟大建党精神32字：坚持真理、坚守理想，践行初心、担当使命，不怕牺牲、英勇斗争，对党忠诚、不负人民——是中国共产党人精神谱系的源头。",s:"政治理论·党史",d:1},
{id:"PL017",c:"pl",q:"新质生产力的特点是（　），关键在（　），本质是先进生产力。",o:["创新；质优","速度；规模","科技；数量","改革；效率"],a:0,e:"新质生产力是创新起主导作用、摆脱传统经济增长方式和生产力发展路径、具有高科技高效能高质量特征的先进生产力质态。特点是创新，关键在质优，本质是先进生产力。由习近平总书记2023年9月在黑龙江考察时首次提出。",s:"政治理论·最新",d:1},
{id:"PL018",c:"pl",q:"“两个结合”是指把马克思主义基本原理同（　）相结合。",o:["中国具体实际、中华优秀传统文化","社会主义市场经济、国际规则","党的历史经验、改革开放实践","人民民主专政、统一战线"],a:0,e:"“两个结合”：同中国具体实际相结合、同中华优秀传统文化相结合，是马克思主义中国化时代化的根本途径，第二个结合是又一次思想解放。",s:"政治理论·新思想",d:1},
{id:"PL019",c:"pl",q:"习近平新时代中国特色社会主义思想的立场观点方法可概括为“六个必须坚持”，其中居首位的是（　）。",o:["必须坚持人民至上","必须坚持自信自立","必须坚持守正创新","必须坚持胸怀天下"],a:0,e:"六个必须坚持：人民至上、自信自立、守正创新、问题导向、系统观念、胸怀天下。人民立场是根本立场，故“人民至上”居首。",s:"政治理论·新思想",d:2},
{id:"PL020",c:"pl",q:"全过程人民民主是社会主义民主政治的本质属性，它应当是（　）的民主。",o:["全链条、全方位、全覆盖","少数服从多数、程序合法","竞争性选举、轮流执政","精英主导、代议决策"],a:0,e:"全过程人民民主是最广泛、最真实、最管用的社会主义民主，实现过程民主与成果民主、程序民主与实质民主、直接民主与间接民主相统一。",s:"政治理论·新思想",d:2},
{id:"PL021",c:"pl",q:"乡村振兴战略的总要求（二十字方针）是产业兴旺、（　）、乡风文明、治理有效、生活富裕。",o:["生态宜居","环境优美","宜业宜游","绿色低碳"],a:0,e:"乡村振兴二十字方针：产业兴旺、生态宜居、乡风文明、治理有效、生活富裕。五大振兴：产业、人才、文化、生态、组织振兴。",s:"政治理论·新思想",d:1},
{id:"PL022",c:"pl",q:"我国粮食安全的基本方针是（　）。",o:["谷物基本自给、口粮绝对安全","粮食完全自给、不进口一粒粮","依靠进口补充、腾地发展工业","藏粮于市、以购保供"],a:0,e:"国家粮食安全战略：以我为主、立足国内、确保产能、适度进口、科技支撑；方针是谷物基本自给、口粮绝对安全，坚守18亿亩耕地红线。",s:"政治理论·新思想",d:2},
{id:"PL023",c:"pl",q:"全面深化改革的总目标是（　）。",o:["完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化","建立社会主义市场经济体制","实现国家机构职能优化协同高效","建成社会主义现代化强国"],a:0,e:"全面深化改革总目标：完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化（十八届三中全会确立）。",s:"政治理论·改革",d:1},
{id:"PL024",c:"pl",q:"习近平法治思想的核心要义集中体现为“十一个坚持”，其中居于首位的是（　）。",o:["坚持党对全面依法治国的领导","坚持人民主体地位","坚持依法治国与以德治国相结合","坚持统筹推进国内法治和涉外法治"],a:0,e:"“十一个坚持”首条即坚持党对全面依法治国的领导，全面依法治国最根本的是保证党的领导。",s:"政治理论·法治",d:2},
{id:"PL025",c:"pl",q:"我国的根本政治制度是（　）。",o:["人民代表大会制度","中国共产党领导的多党合作和政治协商制度","民族区域自治制度","基层群众自治制度"],a:0,e:"人民代表大会制度是根本政治制度；多党合作和政治协商制度、民族区域自治制度、基层群众自治制度是基本政治制度。",s:"政治理论·制度",d:1},
{id:"PL026",c:"pl",q:"我国社会主义基本经济制度的内容包括公有制为主体、多种所有制经济共同发展，按劳分配为主体、多种分配方式并存，以及（　）。",o:["社会主义市场经济体制","计划经济体制","混合经济体制","自由市场经济体制"],a:0,e:"十九届四中全会将社会主义市场经济体制纳入基本经济制度，形成“三位一体”的基本经济制度表述。",s:"政治理论·制度",d:2},
{id:"PL027",c:"pl",q:"“两个毫不动摇”是指（　）。",o:["毫不动摇巩固和发展公有制经济，毫不动摇鼓励、支持、引导非公有制经济发展","毫不动摇扩大内需，毫不动摇深化开放","毫不动摇抓粮食安全，毫不动摇抓能源安全","毫不动摇从严治党，毫不动摇依法治国"],a:0,e:"两个毫不动摇是坚持基本经济制度的重要原则；2025年5月施行的民营经济促进法首次以法律形式落实“两个毫不动摇”。",s:"政治理论·制度",d:1},
{id:"PL028",c:"pl",q:"“绿水青山就是金山银山”理念所指向的发展方式是（　）。",o:["生态优先、绿色发展","先污染后治理","高速增长优先","资源换增长"],a:0,e:"“两山”理念要求坚持生态优先、绿色发展，实现经济发展与生态保护协同共进。我国“双碳”目标：2030年前实现碳达峰、2060年前实现碳中和。",s:"政治理论·生态",d:1},
{id:"PL029",c:"pl",q:"我国的“双碳”目标是指（　）。",o:["2030年前碳达峰、2060年前碳中和","2025年前碳达峰、2050年前碳中和","2035年前碳达峰、本世纪中叶碳中和","2030年前碳中和、2060年前碳达峰"],a:0,e:"中国承诺：二氧化碳排放力争2030年前达到峰值，努力争取2060年前实现碳中和。注意“先达峰、后中和”的顺序。",s:"政治理论·生态",d:1},
{id:"PL030",c:"pl",q:"推动长江经济带发展的战略导向是（　）。",o:["共抓大保护、不搞大开发","大开发、大建设","以航运为中心","先发展后治理"],a:0,e:"长江经济带坚持“共抓大保护、不搞大开发”，走生态优先、绿色发展之路。黄河流域生态保护和高质量发展为又一重大国家战略。",s:"政治理论·战略",d:1},
{id:"PL031",c:"pl",q:"共建“一带一路”遵循的原则是（　）。",o:["共商共建共享","互利共赢、共同发展","平等协商、自愿参与","开放绿色廉洁"],a:0,e:"共商共建共享是原则；丝路精神为“和平合作、开放包容、互学互鉴、互利共赢”。",s:"政治理论·外交",d:2},
{id:"PL032",c:"pl",q:"中国提出的三大全球倡议不包括（　）。",o:["全球发展倡议","全球安全倡议","全球文明倡议","全球气候倡议"],a:3,e:"三大全球倡议：全球发展倡议（2021年）、全球安全倡议（2022年）、全球文明倡议（2023年），为构建人类命运共同体提供重要支撑。",s:"政治理论·外交",d:2},
{id:"PL033",c:"pl",q:"社会主义核心价值观中，属于国家层面价值目标的是（　）。",o:["富强、民主、文明、和谐","自由、平等、公正、法治","爱国、敬业、诚信、友善","创新、协调、绿色、开放"],a:0,e:"24字核心价值观：国家层面——富强、民主、文明、和谐；社会层面——自由、平等、公正、法治；个人层面——爱国、敬业、诚信、友善。",s:"政治理论·文化",d:1},
{id:"PL034",c:"pl",q:"习近平文化思想是在2023年10月全国宣传思想文化工作会议上首次提出的。",o:["正确","错误","正确，但提出于二十大","错误，提出于2021年"],a:0,e:"2023年10月，全国宣传思想文化工作会议正式提出习近平文化思想，标志党的历史自信、文化自信达到新高度。",s:"政治理论·文化·最新",d:2},
{id:"PL035",c:"pl",q:"党的最高理想和最终目标是（　）。",o:["实现共产主义","建成社会主义现代化强国","实现中华民族伟大复兴","实现全体人民共同富裕"],a:0,e:"党的最高理想和最终目标是实现共产主义；现阶段共同理想是坚持和发展中国特色社会主义。党的宗旨是全心全意为人民服务。",s:"政治理论·党史",d:1},
{id:"PL036",c:"pl",q:"中国共产党领导的多党合作和政治协商制度，被称作我国的一项（　）。",o:["新型政党制度","多党竞争制度","一党多元制度","议会协商制度"],a:0,e:"我国新型政党制度的特点：共产党领导、多党派合作，共产党执政、多党派参政，以“长期共存、互相监督、肝胆相照、荣辱与共”为基本方针。",s:"政治理论·制度",d:1},
{id:"PL037",c:"pl",q:"党的二十届三中全会于2024年7月召开，审议通过的重要文件是（　）。",o:["《中共中央关于进一步全面深化改革、推进中国式现代化的决定》","《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》","《中共中央关于党的百年奋斗重大成就和历史经验的决议》","《中共中央关于全面深化改革若干重大问题的决定》"],a:0,e:"二十届三中全会（2024年7月15-18日）通过《关于进一步全面深化改革、推进中国式现代化的决定》，提出300多项重要改革举措。B为二十届四中全会文件；C为十九届六中全会文件；D为十八届三中全会文件。",s:"政治理论·三中全会",d:1},
{id:"PL038",c:"pl",q:"二十届三中全会提出，到（　）年完成《决定》提出的改革任务。",o:["2029","2030","2035","2049"],a:0,e:"到2029年（中华人民共和国成立80周年时）完成《决定》提出的改革任务；到2035年基本实现国家治理体系和治理能力现代化。",s:"政治理论·三中全会",d:2},
{id:"PL039",c:"pl",q:"二十届三中全会强调的进一步全面深化改革贯彻的原则（“六个坚持”）不包括（　）。",o:["坚持党的全面领导","坚持以人民为中心","坚持守正创新","坚持高速增长"],a:3,e:"六个坚持：坚持党的全面领导、坚持以人民为中心、坚持守正创新、坚持以制度建设为主线、坚持全面依法治国、坚持系统观念。",s:"政治理论·三中全会",d:2},
{id:"PL040",c:"pl",q:"党的二十届四中全会召开的时间和审议通过的核心文件是（　）。",o:["2025年10月20日至23日；《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》","2025年7月；《关于进一步全面深化改革、推进中国式现代化的决定》","2026年3月；《政府工作报告》","2024年10月；《中共中央关于党的百年奋斗重大成就和历史经验的决议》"],a:0,e:"二十届四中全会2025年10月20-23日在北京举行，审议通过“十五五”规划《建议》，习近平总书记就《建议（讨论稿）》向全会作了说明。此为2026年省考最核心时政考点。",s:"政治理论·四中全会·最新",d:1},
{id:"PL041",c:"pl",q:"党的二十届四中全会指出，“十五五”时期是（　）。",o:["基本实现社会主义现代化夯实基础、全面发力的关键时期","全面建设社会主义现代化国家的开局时期","实现第二个百年奋斗目标的决胜时期","全面建成小康社会的攻坚时期"],a:0,e:"“十五五”时期在基本实现社会主义现代化进程中具有承前启后的重要地位，是夯实基础、全面发力的关键时期。全会同时指出我国发展环境面临深刻复杂变化，处于战略机遇和风险挑战并存时期。",s:"政治理论·四中全会·最新",d:1},
{id:"PL042",c:"pl",q:"新中国成立以来，我国已经制定和实施了（　）个五年规划（计划）。",o:["12","13","14","15"],a:2,e:"从1953年“一五”计划起到“十四五”，我国共制定实施14个五年规划（计划），制定和实施五年规划是我们党治国理政的一条重要经验、中国特色社会主义制度的一个重要政治优势。",s:"政治理论·四中全会",d:2},
{id:"PL043",c:"pl",q:"到2035年基本实现社会主义现代化远景目标中，人均国内生产总值达到（　）水平。",o:["中等发达国家","发达国家","全球领先","新兴工业化国家"],a:0,e:"到2035年人均GDP达到中等发达国家水平，基本实现新型工业化、信息化、城镇化、农业现代化。本世纪中叶建成富强民主文明和谐美丽的社会主义现代化强国。",s:"政治理论·目标",d:2},
{id:"PL044",c:"pl",q:"党的二十大报告指出，全过程人民民主是（　）。",o:["社会主义民主政治的本质属性","我国根本政治制度","国家治理的基本方式","民主与专政的统一"],a:0,e:"全过程人民民主是社会主义民主政治的本质属性；人民代表大会制度是实现全过程人民民主的重要制度载体。",s:"政治理论·二十大",d:2},
{id:"PL045",c:"pl",q:"共同富裕是中国特色社会主义的本质要求，其实现路径是（　）。",o:["全体人民共同富裕，不是少数人的富裕；允许一部分人先富起来，先富带后富","同步同时同等富裕","通过高福利直接分配实现","只强调做大蛋糕、不注重分配"],a:0,e:"共同富裕是全体人民的富裕，不是少数人的富裕；靠共同奋斗做大蛋糕并合理分好蛋糕，尽力而为、量力而行，坚决防止两极分化。",s:"政治理论·新思想",d:2},
{id:"PL046",c:"pl",q:"“一国两制”是中国特色社会主义的伟大创举，其坚持的方针是（　）。",o:["“爱国者治港”“爱国者治澳”","港人治港、高度自治完全自主","一国优先、两制让步","全面管治替代高度自治"],a:0,e:"必须坚持“一国”是“两制”的前提和基础，落实“爱国者治港”“爱国者治澳”原则，保持香港、澳门长期繁荣稳定。",s:"政治理论·新思想",d:2},
{id:"PL047",c:"pl",q:"中央八项规定于2012年12月出台，其核心指向是（　）。",o:["改进工作作风、密切联系群众","提高机关运行效率","精简机构编制","规范领导干部用车"],a:0,e:"中央八项规定从改进调查研究、精简会议活动、厉行勤俭节约等八个方面入手，改进工作作风、密切联系群众，是新时代管党治党的“金色名片”。",s:"政治理论·党建",d:2},
{id:"PL048",c:"pl",q:"新时代党的建设总要求明确，党的建设必须以（　）为统领。",o:["党的政治建设","思想建设","组织建设","纪律建设"],a:0,e:"以党的政治建设为统领，以坚定理想信念宗旨为根基，以调动全党积极性、主动性、创造性为着力点，全面推进党的各方面建设。",s:"政治理论·党建",d:2},
{id:"PL049",c:"pl",q:"党的二十大报告将（　）确立为党执政兴国的第一要务。",o:["发展","改革","安全","创新"],a:0,e:"发展是党执政兴国的第一要务；高质量发展是首要任务；安全是民族复兴的根基（国家安全是头等大事）。",s:"政治理论·二十大",d:2},
{id:"PL050",c:"pl",q:"在推进祖国完全统一进程中，我国解决台湾问题的基本方针是（　）。",o:["“和平统一、一国两制”","武力统一、速战速决","维持现状、搁置争议","两岸各自表述、对等协商"],a:0,e:"解决台湾问题、实现祖国完全统一，坚持“和平统一、一国两制”基本方针，坚决反对“台独”分裂行径和外部势力干涉。",s:"政治理论·新思想",d:1},
{id:"PL051",c:"pl",q:"我国全过程人民民主的重要制度载体和最高实现形式是（　）。",o:["人民代表大会制度","政治协商会议","基层群众自治","职工代表大会"],a:0,e:"人民代表大会制度是坚持党的领导、人民当家作主、依法治国有机统一的重要制度载体，是实现全过程人民民主的重要制度载体。",s:"政治理论·制度",d:2},
{id:"PL052",c:"pl",q:"新时代做好经济工作的根本保证是（　）。",o:["党中央集中统一领导","充分发挥市场作用","扩大内需战略","稳中求进"],a:0,e:"坚持党中央集中统一领导是做好经济工作的根本保证；稳中求进是工作总基调。",s:"政治理论·经济",d:3},
{id:"PL053",c:"pl",q:"党的二十届四中全会对“十五五”时期发展作出系统谋划，强调必须坚持以（　）为首要任务，推进中国式现代化行稳致远。",o:["高质量发展","高速增长","扩大开放","科技创新"],a:0,e:"四中全会以“锚定中国式现代化发展新目标”为主线，强调高质量发展是首要任务，必须把推进中国式现代化作为最大的政治。",s:"政治理论·四中全会·最新",d:2},
{id:"PL054",c:"pl",q:"“十四五”时期，我国国内生产总值年均增长率为（　）。",o:["5%左右","5.4%左右","6%以上","4.5%左右"],a:1,e:"“十四五”期间我国GDP年均增长5.4%，经济总量相继跨越多个台阶；2025年我国GDP增长5%，“十四五”圆满收官。",s:"政治理论·十四五",d:2},
{id:"PL055",c:"pl",q:"党的自我革命是我们党跳出治乱兴衰历史周期率的第二个答案。第一个答案是（　）。",o:["让人民来监督政府","严刑峻法","舆论监督","巡视监察"],a:0,e:"1945年“窑洞对”中毛泽东给出第一个答案——让人民来监督政府；经过百年奋斗特别是新时代实践，习近平给出第二个答案——自我革命。",s:"政治理论·党建",d:2},

{id:"SZ048",c:"sz",q:"我国2025年城镇新增就业完成（　）万人。",o:["1100","1200","1267","1300"],a:2,e:"2025年城镇新增就业1267万人，超额完成1200万人的预期目标；2026年预期目标仍为1200万人以上。",s:"时政·2025成就",d:2},
{id:"SZ049",c:"sz",q:"关于“十五五”规划《建议》与《纲要》的关系，正确的说法是（　）。",o:["《建议》由党的全会审议通过，指导《纲要》编制；《纲要》由国务院编制、全国人大审查批准","《纲要》指导《建议》的起草","两者由同一机构同时通过","《建议》具有法律效力，《纲要》没有"],a:0,e:"规划编制程序体现“党的领导—政府编制—人大批准”：先由五中全会通过《建议》定方向，再据此编制《纲要（草案）》提请全国人大审查批准，把党的主张转化为国家意志。",s:"时政·十五五",d:2},
{id:"SZ050",c:"sz",q:"2026年中央一号文件继续聚焦“三农”，其主题主线是（　）。",o:["推进乡村全面振兴、确保国家粮食安全","城市反哺农村","农业机械化","农村电商发展"],a:0,e:"进入新世纪以来中央一号文件持续聚焦“三农”，近年主题均为推进乡村全面振兴、建设农业强国、保障粮食安全，强调树立和践行正确政绩观、改进农村工作方式方法。",s:"时政·一号文件",d:2},

{id:"LS001",c:"ls",q:"道家学派创始人老子著有《道德经》，其故里传统说法之一位于今安徽（　）。",o:["涡阳","亳州","蒙城","寿县"],a:0,e:"老子故里有安徽涡阳与河南鹿邑两说。庄子故里亦有安徽蒙城与河南商丘两说，考试多以“老庄故里在皖北”综合表述。",s:"历史·先秦",d:2},
{id:"LS002",c:"ls",q:"《逍遥游》《齐物论》的作者是（　）。",o:["老子","庄子","列子","韩非子"],a:1,e:"庄子名周，战国时期宋国蒙人（今安徽蒙城一说），主张“天人合一”“清静无为”，文风汪洋恣肆，是先秦诸子散文的代表。",s:"历史·先秦",d:1},
{id:"LS003",c:"ls",q:"“管鲍之交”的主人公管仲是春秋时期著名政治家，其故里在今安徽（　）。",o:["颍上","涡阳","砀山","怀远"],a:0,e:"管仲（颍上人）辅佐齐桓公“九合诸侯、一匡天下”，被誉为“法家先驱”“华夏第一相”，与鲍叔牙的相知被称为“管鲍之交”。",s:"历史·先秦",d:2},
{id:"LS004",c:"ls",q:"发明“麻沸散”、创编“五禽戏”、被后世尊为“外科圣手”的是（　）。",o:["张仲景","华佗","扁鹊","孙思邈"],a:1,e:"华佗（东汉末，亳州人）发明麻沸散用于外科手术麻醉，创五禽戏导引养生，与董奉、张仲景并称“建安三神医”。",s:"历史·秦汉",d:1},
{id:"LS005",c:"ls",q:"“老骥伏枥，志在千里”出自（　）的诗作，他是今安徽亳州人。",o:["曹操","曹植","刘备","孙权"],a:0,e:"《龟虽寿》为曹操所作。曹操系沛国谯县（今亳州）人，与其子曹丕、曹植同为建安文学领袖，“建安风骨”影响深远。",s:"历史·秦汉",d:1},
{id:"LS006",c:"ls",q:"“竹林七贤”之一、临刑前从容弹奏《广陵散》的嵇康是今安徽（　）人。",o:["濉溪","涡阳","宿州","萧县"],a:0,e:"嵇康为谯国铚县（今安徽濉溪）人，主张“越名教而任自然”，其《广陵散》成为绝响，是魏晋风度的代表人物。",s:"历史·魏晋",d:3},
{id:"LS007",c:"ls",q:"以清廉刚正著称、民间尊为“包青天”的北宋名臣包拯是（　）人。",o:["庐州合肥","开封","徽州歙县","池州"],a:0,e:"包拯（999—1062），庐州合肥人，曾任开封府尹、御史中丞等，铁面无私，“关节不到，有阎罗包老”流传至今。合肥存有包公祠、包公墓。",s:"历史·宋元",d:1},
{id:"LS008",c:"ls",q:"明朝开国皇帝朱元璋的出生地是（　）。",o:["濠州钟离（今安徽凤阳）","应天（今南京）","濠州怀远","庐州合肥"],a:0,e:"朱元璋（1328—1398）生于濠州钟离（今安徽凤阳），年号洪武。凤阳现存明中都皇故城遗址，其营建规模仅次于南京、北京皇城。",s:"历史·明清",d:1},
{id:"LS009",c:"ls",q:"理学集大成者朱熹与安徽的渊源是（　）。",o:["祖籍徽州婺源","出生于黄山","任职于安庆","讲学于宣城"],a:0,e:"朱熹祖籍徽州婺源（今属江西），徽州因此成为“程朱阙里”、新安理学发源地，深刻塑造了徽州“东南邹鲁”的文化品格。",s:"历史·宋元",d:2},
{id:"LS010",c:"ls",q:"清代乾嘉考据学“皖派”的代表人物、休宁人（　）以“无征不信”的治学方法名世。",o:["戴震","段玉裁","钱大昕","王念孙"],a:0,e:"戴震（休宁人）为“皖派”朴学宗师，主张“由字通词、由词通道”，以实事求是为宗旨；后三人为其同时代学者。",s:"历史·明清",d:3},
{id:"LS011",c:"ls",q:"中国古典讽刺小说的高峰《儒林外史》的作者吴敬梓是（　）人。",o:["安徽全椒","江苏吴县","浙江绍兴","湖北黄冈"],a:0,e:"吴敬梓（1701—1754），安徽全椒人。《儒林外史》以“范进中举”等名篇讽刺科举制度下的世态人情，鲁迅评其“秉持公心，指擿时弊”。",s:"文学·明清",d:1},
{id:"LS012",c:"ls",q:"《登泰山记》的作者、桐城派集大成者是（　）。",o:["方苞","刘大櫆","姚鼐","曾国藩"],a:2,e:"姚鼐（桐城人）主张“义理、考据、辞章”合一，编《古文辞类纂》，使桐城派成为清代影响最大的散文流派。",s:"文学·明清",d:2},
{id:"LS013",c:"ls",q:"新文化运动的旗手、中国共产党的主要创始人之一陈独秀是安徽（　）人。",o:["怀宁","绩溪","合肥","桐城"],a:0,e:"陈独秀（1879—1942），安庆怀宁人，1915年创办《新青年》（原名《青年杂志》），高举“民主与科学”大旗，后与李大钊“南陈北李，相约建党”。",s:"历史·近现代",d:1},
{id:"LS014",c:"ls",q:"发表《文学改良刍议》、大力倡导白话文的新文化运动代表人物胡适是安徽（　）人。",o:["绩溪","歙县","休宁","黟县"],a:0,e:"胡适（绩溪人）1917年发表《文学改良刍议》，与陈独秀《文学革命论》相呼应，掀起文学革命；其“大胆的假设、小心的求证”影响深远。",s:"历史·近现代",d:1},
{id:"LS015",c:"ls",q:"提出“生活即教育”“社会即学校”“教学做合一”的人民教育家陶行知是安徽（　）人。",o:["歙县","休宁","宣城","泾县"],a:0,e:"陶行知（歙县人）创办南京晓庄师范，名言“捧着一颗心来，不带半根草去”，与晏阳初并称平民教育两大先驱。",s:"历史·近现代",d:2},
{id:"LS016",c:"ls",q:"被誉为“两弹元勋”的核物理学家邓稼先是安徽（　）人。",o:["怀宁","合肥","泾县","宁国"],a:0,e:"邓稼先（1924—1986），怀宁人，隐姓埋名28年主持原子弹、氢弹研制，1999年被追授“两弹一星”功勋奖章。",s:"历史·当代",d:1},
{id:"LS017",c:"ls",q:"1957年因提出“宇称不守恒理论”获得诺贝尔物理学奖的安徽籍物理学家是（　）。",o:["杨振宁","李政道","丁肇中","钱学森"],a:0,e:"杨振宁生于合肥，1957年与李政道共获诺贝尔物理学奖；他晚年归根清华，并对合肥科教发展多有贡献。李政道为上海人，丁肇中生于美国（祖籍山东）。",s:"历史·当代",d:1},
{id:"LS018",c:"ls",q:"党史上最早提出“毛泽东思想”科学概念的我党重要领导人、安徽泾县人是（　）。",o:["王稼祥","周恩来","刘少奇","邓小平"],a:0,e:"王稼祥（泾县人）1943年在《中国共产党与中国民族解放的道路》中首次提出并论述“毛泽东思想”这一概念。",s:"历史·党史",d:3},
{id:"LS019",c:"ls",q:"冯玉祥、张治中、李克农三位近代名人史称“巢湖三将军”，他们的共同籍贯是（　）。",o:["安徽巢县（今巢湖市）","安徽合肥","安徽六安","安徽寿县"],a:0,e:"巢湖走出的三位名将：爱国将领冯玉祥、“和平将军”张治中、“特工之王”李克农（开国上将），并称“巢湖三将军（三上将）”。",s:"历史·近现代",d:3},
{id:"LS020",c:"ls",q:"成语“四面楚歌”“十面埋伏”与下列哪场战役有关？该战役的古战场在今安徽境内。（　）",o:["垓下之战","赤壁之战","官渡之战","淝水之战"],a:0,e:"公元前202年垓下之战（古战场在今安徽固镇、灵璧一带），刘邦围困项羽，四面楚歌中项羽自刎于乌江（今安徽和县）。",s:"历史·秦汉",d:2},
{id:"LS021",c:"ls",q:"成语“风声鹤唳、草木皆兵”出自的淝水之战，发生在今安徽（　）。",o:["淮南寿县","合肥","蚌埠","芜湖"],a:0,e:"公元383年，东晋谢安指挥谢石、谢玄等以八万之众大败前秦苻坚数十万大军于淝水（今淮南寿县附近），是历史上以少胜多的著名战例。",s:"历史·秦汉魏晋",d:2},
{id:"LS022",c:"ls",q:"中国历史上第一次大规模农民起义——大泽乡起义的领导者是（　）。",o:["陈胜、吴广","刘邦、项羽","张角","黄巢"],a:0,e:"公元前209年，陈胜、吴广在蕲县大泽乡（今安徽宿州）揭竿而起，喊出“王侯将相宁有种乎”，点燃反秦烽火。",s:"历史·秦汉",d:1},
{id:"LS023",c:"ls",q:"相传“禹会诸侯于涂山，执玉帛者万国”，涂山位于今安徽（　）。",o:["蚌埠","淮南","滁州","合肥"],a:0,e:"蚌埠涂山是大禹“劈山导淮”、娶涂山氏女的传说地，禹会诸侯遗址（禹会村）已在考古中得到印证。",s:"历史·先秦",d:3},
{id:"LS024",c:"ls",q:"战国末期楚国迁都寿春（今安徽寿县），此后寿春成为（　）文化的积淀中心之一。",o:["楚文化","燕文化","齐鲁文化","巴蜀文化"],a:0,e:"楚考烈王迁都寿春后，楚文化重心随之东移。寿县出土的楚大鼎（铸客大鼎）为国家一级文物，现藏安徽博物院。",s:"历史·先秦",d:2},
{id:"LS025",c:"ls",q:"西汉淮南王刘安主持编撰的、保存“女娲补天”“后羿射日”等神话的著作是（　）。",o:["《淮南子》","《山海经》","《吕氏春秋》","《说苑》"],a:0,e:"《淮南子》（又称《淮南鸿烈》）“牢笼天地、博极古今”，为黄老道家集大成著作；“塞翁失马”“一叶知秋”等成语亦出自其中。相传豆腐亦为刘安炼丹所得。",s:"历史·秦汉",d:2},
{id:"LS026",c:"ls",q:"新石器时代晚期、以精美玉器闻名、被称为“中华文明探源工程”重要遗址的是安徽（　）。",o:["含山凌家滩遗址","蚌埠双墩遗址","濉溪石山子遗址","潜山薛家岗遗址"],a:0,e:"凌家滩遗址（含山县，距今约5800年）出土玉人、玉鹰、玉龟等，其玉文化早于良渚，是中华文明起源研究的关键节点。",s:"历史·考古",d:3},
{id:"LS027",c:"ls",q:"1861年曾国藩创办的中国近代第一家军工企业是（　）。",o:["安庆内军械所","江南制造总局","福州船政局","金陵机器局"],a:0,e:"安庆内军械所为洋务运动之发端，徐寿、华蘅芳在此造出中国第一台蒸汽机、第一艘木质机动轮船“黄鹄号”。江南制造总局（1865，李鸿章创办）为当时最大军工企业。",s:"历史·近代",d:2},
{id:"LS028",c:"ls",q:"主持创办江南制造总局、轮船招商局的洋务派代表人物李鸿章是（　）人。",o:["安徽合肥","安徽安庆","江苏南京","湖南长沙"],a:0,e:"李鸿章（1823—1901），合肥人，淮军创始者。合肥现为“新能源汽车之都”，与其淮军历史共同构成城市记忆。",s:"历史·近代",d:1},
{id:"LS029",c:"ls",q:"《新青年》杂志创刊于1915年，其最初的名字是（　）。",o:["《青年杂志》","《新潮》","《每周评论》","《觉悟》"],a:0,e:"1915年9月陈独秀在上海创办《青年杂志》，自第二卷起改名《新青年》。1917年编辑部迁北京后成为新文化运动主阵地。",s:"历史·近现代",d:2},
{id:"LS030",c:"ls",q:"中国共产党第一次全国代表大会召开的时间和最初地点是（　）。",o:["1921年7月23日，上海","1921年7月1日，北京","1920年8月，上海","1921年8月，嘉兴"],a:0,e:"中共一大1921年7月23日在上海召开，因密探闯入转移至浙江嘉兴南湖红船闭幕。7月1日为建党纪念日。",s:"历史·党史",d:1},
{id:"LS031",c:"ls",q:"遵义会议召开于（　）年，被誉为党的历史上生死攸关的转折点。",o:["1934","1935","1936","1937"],a:1,e:"1935年1月遵义会议确立以毛泽东同志为主要代表的马克思主义正确路线在党中央的领导地位，在极端危急关头挽救了党、红军和中国革命。",s:"历史·党史",d:1},
{id:"LS032",c:"ls",q:"红军长征胜利结束的标志是1936年10月三大主力在（　）会师。",o:["甘肃会宁","陕北吴起镇","四川懋功","贵州遵义"],a:0,e:"1936年10月红一、二、四方面军在甘肃会宁、将台堡会师，标志长征胜利结束。长征行程二万五千里，跨越十余省。",s:"历史·党史",d:1},
{id:"LS033",c:"ls",q:"新四军在皖南的军部旧址位于泾县（　），新四军曾在此坚持华中抗战。",o:["云岭","茂林","查济","桃花潭"],a:0,e:"泾县云岭为新四军军部旧址（1938—1941），被称为“新四军的摇篮”；茂林则是1941年皖南事变激战地。",s:"历史·党史·安徽",d:2},
{id:"LS034",c:"ls",q:"淮海战役中，被中央军委赋予“统一指挥”职责的总前委书记是（　）。",o:["邓小平","刘伯承","陈毅","粟裕"],a:0,e:"淮海战役总前委由刘伯承、陈毅、邓小平、粟裕、谭震林组成，邓小平任总前委书记。淮海战役的胜利是“人民群众用小车推出来的”。",s:"历史·党史",d:2},
{id:"LS035",c:"ls",q:"“钟山风雨起苍黄，百万雄师过大江”描述的渡江战役发起于（　）年4月。",o:["1948","1949","1950","1947"],a:1,e:"1949年4月20日夜起，人民解放军百万雄师在西起湖口、东至江阴的千里战线强渡长江，4月23日解放南京。渡江战役总前委驻合肥肥东瑶岗。",s:"历史·党史",d:1},
{id:"LS036",c:"ls",q:"我国第一颗原子弹爆炸成功的时间是（　）。",o:["1964年10月16日","1967年6月17日","1970年4月24日","1966年10月27日"],a:0,e:"1964年10月16日第一颗原子弹爆炸成功；1967年6月17日第一颗氢弹空爆试验成功；1970年“东方红一号”卫星发射成功。安徽怀宁人邓稼先为“两弹”研制作出卓越贡献。",s:"历史·当代",d:1},
{id:"LS037",c:"ls",q:"中国古代四大发明中，活字印刷术的发明者是北宋的（　）。",o:["毕昇","蔡伦","鲁班","张衡"],a:0,e:"毕昇发明泥活字印刷，早于古腾堡约400年；蔡伦改进造纸术；鲁班为建筑鼻祖；张衡发明地动仪。",s:"历史·古代",d:1},
{id:"LS038",c:"ls",q:"科举制度正式创立于（　）朝，1905年被废除。",o:["汉","隋","唐","宋"],a:1,e:"隋炀帝创进士科，标志科举制确立；唐代完善（武则天创殿试、武举），1905年清末新政废科举、兴学堂，历时1300年。",s:"历史·古代",d:1},
{id:"LS039",c:"ls",q:"隋唐大运河的通济渠段流经今安徽淮北，留下了列入世界文化遗产的（　）遗址。",o:["柳孜运河遗址","双墩遗址","垓下遗址","明中都遗址"],a:0,e:"2014年“中国大运河”申遗成功，淮北柳孜运河遗址作为隋唐大运河通济渠段的重要遗产点入列，实证运河文明。",s:"历史·古代·安徽",d:3},
{id:"LS040",c:"ls",q:"“百家争鸣”中，主张“兼爱”“非攻”的是（　）学派。",o:["墨家","儒家","法家","道家"],a:0,e:"墨家（墨子）主张兼爱、非攻、尚贤、节用；儒家主张仁与礼；法家主张以法治国；道家主张无为而治。",s:"历史·先秦",d:1},
{id:"LS041",c:"ls",q:"下列古代文化名人与其称号对应正确的是（　）。",o:["“书圣”王羲之、“诗圣”杜甫、“词中之龙”辛弃疾","“书圣”颜真卿、“诗圣”李白、“词宗”李清照","“画圣”吴道子、“茶圣”陆羽、“医圣”华佗","“文圣”孔子、“武圣”岳飞、“史圣”班固"],a:0,e:"书圣王羲之、诗圣杜甫、词中之龙辛弃疾、画圣吴道子、茶圣陆羽、医圣张仲景（华佗尊为“外科圣手”）、武圣关羽、史圣司马迁。注意C项“医圣”应为张仲景。",s:"历史·文化",d:2},
{id:"LS042",c:"ls",q:"《史记》是我国第一部纪传体通史，其作者是（　）。",o:["司马迁","司马光","班固","陈寿"],a:0,e:"司马迁著《史记》（上起黄帝、下至汉武帝），鲁迅誉为“史家之绝唱，无韵之《离骚》”。司马光著《资治通鉴》（编年体），班固著《汉书》（断代史）。",s:"历史·文化",d:1},
{id:"LS043",c:"ls",q:"“三顾茅庐”“鞠躬尽瘁”的主人公诸葛亮与安徽的历史渊源是（　）。",o:["其妻黄氏为亳州人，无直接渊源","曾任职庐江","曾在合肥与张辽交战","琅琊阳都人，与安徽无涉"],a:2,e:"诸葛亮为琅琊阳都（今山东沂南）人，但215年合肥之战中张辽八百勇士破孙权十万大军于逍遥津（今合肥），与诸葛亮无直接关联——此题提醒考生勿被“名人—地名”惯性搭配误导。",s:"历史·秦汉",d:3},
{id:"LS044",c:"ls",q:"张辽以少胜多大破孙权的“逍遥津之战”发生在今（　）。",o:["合肥","芜湖","寿县","巢湖"],a:0,e:"215年合肥之战，张辽率八百勇士突袭孙权十万大军，威震逍遥津（今合肥），留下“张辽止啼”典故，是三国时期经典战例。",s:"历史·秦汉·安徽",d:2},
{id:"LS045",c:"ls",q:"徽州文化的核心区域历史上称“一府六县”，其中黟县的代表性世界文化遗产是（　）。",o:["宏村","西递","两者均位于黟县","棠樾牌坊群"],a:2,e:"西递、宏村均在黟县，2000年作为“皖南古村落”列入世界文化遗产。棠樾牌坊群在歙县。",s:"文化·徽州",d:2},
{id:"LS046",c:"ls",q:"新安理学、新安画派、徽州朴学等冠以“新安”之名的学术流派，得名于（　）。",o:["新安江（徽州母亲河）","新安县","新安郡城","新安商人"],a:0,e:"新安江发源于徽州，是徽州文化意象之魂。“新安”系列是徽州文化作为“区域性文化高峰”的学术象征。",s:"文化·徽州",d:3},
{id:"LS047",c:"ls",q:"新安画派的奠基人、明末清初“四僧”之一的渐江（弘仁）擅长画（　）。",o:["黄山山水","人物仕女","花鸟草虫","鞍马走兽"],a:0,e:"渐江（歙县人）以画黄山著称，“敢言天地是吾师”，与石涛、髡残、八大山人并称清初四僧，开创新安画派简淡高逸画风。",s:"文化·徽州",d:3},
{id:"LS048",c:"ls",q:"“徽州三雕”是指木雕、石雕和（　）。",o:["砖雕","竹雕","玉雕","根雕"],a:0,e:"徽州三雕（木雕、石雕、砖雕）广泛用于民居、祠堂、牌坊，工艺繁复精美，是徽派建筑的精华所在。",s:"文化·徽州",d:1},
{id:"LS049",c:"ls",q:"徽墨名坊“胡开文”、歙砚名匠辈出，体现徽州物产文化。与“笔墨纸砚”整体相关的安徽城市名片是（　）。",o:["宣城","安庆","池州","铜陵"],a:0,e:"宣城为“中国文房四宝之城”（宣笔、宣纸主产地），歙县主产徽墨、歙砚——安徽一省聚齐文房四宝，故有“中国文房四宝，安徽取其半”之说。",s:"文化·安徽",d:1},
{id:"LS050",c:"ls",q:"“无徽不成镇”反映了明清时期徽商的深远影响。徽商最兴盛的行业是（　）。",o:["盐业","渔业","矿业","牧业"],a:0,e:"盐业为徽商第一大业（两淮盐商多徽州籍），其次为典当、茶叶、木材。徽商“贾而好儒”，反哺家乡形成徽州村落与书院文化。",s:"历史·明清",d:2},
{id:"LS051",c:"ls",q:"京剧形成的直接源头是徽班进京后的“徽汉合流”。京剧最终形成于（　）时期。",o:["清道光年间","明万历年间","民国初年","新中国成立后"],a:0,e:"徽班进京（1790）后吸纳汉调（西皮）、昆腔、梆子诸腔，约在道光年间皮黄声腔成熟，京剧正式形成。",s:"文化·戏曲",d:2},
{id:"LS052",c:"ls",q:"中国古典文学“四大名著”的作者依次是罗贯中、施耐庵、吴承恩和（　）。",o:["曹雪芹","吴敬梓","蒲松龄","冯梦龙"],a:0,e:"四大名著：《三国演义》罗贯中、《水浒传》施耐庵、《西游记》吴承恩、《红楼梦》曹雪芹。吴敬梓著《儒林外史》（安徽全椒人），属“四大讽刺小说”之首。",s:"文学·古代",d:1},
{id:"LS053",c:"ls",q:"“元曲四大家”不包括（　）。",o:["关汉卿","王实甫","马致远","白朴"],a:1,e:"元曲四大家：关汉卿、白朴、马致远、郑光祖。王实甫《西厢记》成就极高但传统上不在“四大家”之列。",s:"文学·古代",d:3},
{id:"LS054",c:"ls",q:"“初唐四杰”是指王勃、杨炯、卢照邻和（　）。",o:["骆宾王","陈子昂","贺知章","张若虚"],a:0,e:"初唐四杰：王勃、杨炯、卢照邻、骆宾王。代表作王勃《滕王阁序》、骆宾王《讨武曌檄》。",s:"文学·古代",d:2},
{id:"LS055",c:"ls",q:"下列文献典故与“丝绸之路”开辟相关的人物是（　）。",o:["张骞","班超","郑和","玄奘"],a:0,e:"张骞两通西域（汉武帝时期）凿空丝路；班超经营西域30余年；郑和七下西洋开海上丝路；玄奘西行取经。",s:"历史·秦汉",d:1},
{id:"LS056",c:"ls",q:"郑和下西洋发生在明代（　）在位期间，最远到达非洲东海岸。",o:["明成祖朱棣","明太祖朱元璋","明世宗嘉靖","明神宗万历"],a:0,e:"1405—1433年郑和七下西洋（首航于永乐三年），是世界航海史上的壮举，早于哥伦布航行半个多世纪。",s:"历史·明清",d:1},
{id:"LS057",c:"ls",q:"中国近代史上第一个不平等条约是（　）。",o:["《南京条约》","《北京条约》","《马关条约》","《辛丑条约》"],a:0,e:"1842年《南京条约》割香港岛、开放五口通商。安徽合肥人李鸿章1895年签订《马关条约》、1901年签订《辛丑条约》。",s:"历史·近代",d:1},
{id:"LS058",c:"ls",q:"洋务运动期间，李鸿章创办的当时最大的近代军工企业是（　）。",o:["江南制造总局","安庆内军械所","天津机器局","汉阳铁厂"],a:0,e:"江南制造总局（1865年，上海）是洋务运动规模最大的军工企业；安庆内军械所（1861年，曾国藩创办）是中国第一家近代军工企业。汉阳铁厂为张之洞创办的冶金企业。",s:"历史·近代",d:2},
{id:"LS059",c:"ls",q:"五四运动的导火索是1919年巴黎和会上中国外交失败，其爆发的直接地点是（　）。",o:["北京","上海","广州","南京"],a:0,e:"1919年5月4日北京学生发起游行（“外争主权、内除国贼”），6月后上海工人罢工、商人罢市，运动中心由北京转到上海，工人阶级登上政治舞台。",s:"历史·近现代",d:1},
{id:"LS060",c:"ls",q:"中国人民政治协商会议第一届全体会议于1949年9月在北平召开，会议决定（　）。",o:["确定国都、国旗、国歌，通过《共同纲领》","颁布《中华人民共和国宪法》","实行人民代表大会制度","通过第一个五年计划"],a:0,e:"政协一届全会通过《共同纲领》（临时宪法作用），定都北平改称北京，确定国旗、国歌；1954年一届全国人大才通过宪法。",s:"历史·当代",d:2},
{id:"LS061",c:"ls",q:"安徽歙县棠樾牌坊群以“忠、孝、节、义”闻名，其建筑类型属于（　）。",o:["旌表性纪念建筑","防御性城堡","宗教性庙宇","商业性会馆"],a:0,e:"牌坊是封建礼教的旌表建筑。棠樾七连牌坊（明清）为全国罕见，鲍氏家族“义”字坊尤其著称。",s:"文化·徽州",d:3},
{id:"LS062",c:"ls",q:"中国首个国家级文化生态保护实验区（2007年设立）是（　），后成为全国首个跨省的文化生态保护区。",o:["徽州文化生态保护实验区","闽南文化生态保护实验区","热贡文化生态保护实验区","羌族文化生态保护实验区"],a:0,e:"徽州文化生态保护区覆盖黄山市、绩溪县及江西婺源县，是全国首个跨省共建的文化生态保护区（2019年验收转正），保护徽州非物质与物质文化遗产整体环境。",s:"文化·徽州",d:3},
{id:"LS063",c:"ls",q:"下列历史事件按时间先后排序正确的是（　）。①大泽乡起义 ②垓下之战 ③淝水之战 ④渡江战役",o:["①②③④","②①③④","①③②④","②③①④"],a:0,e:"大泽乡起义（前209）→垓下之战（前202）→淝水之战（383年）→渡江战役（1949年）。注意垓下在起义之后、秦亡之前。",s:"历史·综合",d:2},
{id:"LS064",c:"ls",q:"安徽被称为“戏曲活化石”、以驱疫祈福为原始功能的是（　）。",o:["池州傩戏","黄梅戏","泗州戏","坠子戏"],a:0,e:"池州傩戏被誉为“戏曲活化石”，以戴面具表演为特征，承载上古傩文化遗存，入选首批国家级非遗。",s:"文化·安徽",d:3},
{id:"LS065",c:"ls",q:"“人民满意的教育”“大先生”等表述是新时代教育重要论述。与此相关，安徽籍人民教育家陶行知的主要教育实践是（　）。",o:["创办晓庄师范，践行平民教育与乡村教育","创办南开学校","创办浙江大学","领导留法勤工俭学"],a:0,e:"陶行知1927年创办南京晓庄试验乡村师范，提出“千教万教教人求真，千学万学学做真人”；张伯苓办南开，蔡元培改革北大，李石曾组织留法勤工俭学。",s:"历史·近现代",d:2},
{id:"LS066",c:"ls",q:"二十四节气中，兼具“节气”与“重大传统节日”双重身份的是（　）。",o:["清明","端午","中秋","重阳"],a:0,e:"清明是二十四节气中唯一演化为重大民俗节日的节气，融合寒食、上巳习俗；端午、中秋、重阳是传统节日但非节气。节气于2016年列入人类非遗。",s:"文化·综合",d:1},
{id:"LS067",c:"ls",q:"安徽现有世界文化与自然双重遗产、世界文化遗产（皖南古村落）和世界遗产点（柳孜运河遗址）之外，下列名山若参评世界自然遗产，其最具竞争力的资源禀赋是（　）。",o:["黄山的花岗岩峰林地貌与生物多样性","九华山的佛教建筑","天柱山的花岗岩地貌","齐云山的丹霞地貌"],a:0,e:"黄山已为双遗产。此题训练“遗产类型判断”：佛教建筑属文化价值，花岗岩峰林与生物多样性属自然价值。天柱山已列入世界地质公园网络。",s:"文化·综合",d:3},
{id:"LS068",c:"ls",q:"《觉醒年代》《革命者》等影视作品再现了建党先驱群像。其中籍贯为安徽、并以“研究室与监狱是青年人生最高尚优美生活”名句激励后人的《新青年》主编是（　）。",o:["陈独秀","李大钊","鲁迅","钱玄同"],a:0,e:"陈独秀（怀宁人）名句出自《新青年》随感录。李大钊（河北乐亭）为最早的马克思主义传播者，钱玄同（浙江湖州）为《新青年》同人。",s:"历史·近现代",d:2},
{id:"LS069",c:"ls",q:"淮军是晚清重要军事政治集团。下列淮军将领与事迹对应正确的是（　）。",o:["刘铭传——首任台湾巡抚","丁汝昌——创办轮船招商局","聂士成——镇南关大捷","张树声——甲午黄海海战殉国"],a:0,e:"刘铭传（合肥人）1885年首任台湾巡抚，被誉为“台湾近代化之父”；丁汝昌（庐江人）为北洋水师提督，威海卫之战殉国（非黄海海战）。",s:"历史·近代·安徽",d:3},
{id:"LS070",c:"ls",q:"“文房四宝”对应的主要产地，下列完全正确的一组是（　）。",o:["湖笔（浙江湖州）、徽墨（安徽歙县/绩溪）、宣纸（安徽泾县）、端砚（广东肇庆）","湖笔（安徽泾县）、徽墨（安徽歙县）、宣纸（安徽泾县）、歙砚（安徽歙县）","宣笔（安徽宣城）、徽墨（安徽）、宣纸（安徽）、歙砚（安徽）——均为安徽","宣笔（浙江）、徽墨（江西）、宣纸（福建）、端砚（安徽）"],a:0,e:"传统最优组合“湖笔、徽墨、宣纸、端砚”中安徽占其二；而安徽省内可集齐宣笔、徽墨、宣纸、歙砚“四宝”，故宣城称“中国文房四宝之城”。",s:"文化·安徽",d:2},

{id:"AH061",c:"ah",q:"2008年，安徽省开始实施合芜蚌________综合配套改革试验区建设，着力提升区域自主创新能力。",o:["城乡一体化","经济开发","城市经济圈","自主创新"],a:3,e:"合芜蚌自主创新综合配套改革试验区覆盖合肥、芜湖、蚌埠三市，2008年启动建设，是安徽建设创新型省份的关键平台，与皖江城市带承接产业转移示范区并称两大战略平台。（源自安徽历年省考真题）",s:"省情真题·发展战略",d:2},
{id:"AH062",c:"ah",q:"安徽省“861”行动计划中的“6”是指（　）。",o:["六大城市经济区域","六大重点产业基地","六大基础工程","六所重点高等院校"],a:2,e:"“861”行动计划（2003年起实施）：“8”指八大重点产业基地，“6”指六大基础工程，“1”指当年确定的若干项重要工作任务。曾是安徽“十一五”“十二五”期间的发展总抓手。（源自安徽历年省考真题）",s:"省情真题·发展战略",d:2},
{id:"AH063",c:"ah",q:"安徽省第九次党代会提出，要在“十二五”期间努力把安徽打造成“三个强省”。下列不属于“三个强省”的是（　）。",o:["工业强省","经济强省","文化强省","生态强省"],a:0,e:"“三个强省”指经济强省、文化强省、生态强省，是安徽省第九次党代会（2011年）提出的战略目标。（源自安徽历年省考真题）",s:"省情真题·发展战略",d:2},
{id:"AH064",c:"ah",q:"近年来，安徽省自主创新战略平台建设取得突破性进展，一批企业的自主创新能力大幅提升。其中，成为安徽自主创新“一面旗帜”的企业是（　）。",o:["合肥江汽","马鞍山华菱重卡","芜湖奇瑞","铜陵铜基新材料"],a:2,e:"奇瑞汽车自芜湖起步，坚持自主研发发动机、变速箱等核心技术，成为中国自主品牌汽车的代表，被誉为安徽自主创新的一面旗帜。（源自安徽历年省考真题）",s:"省情真题·科技创新",d:1},
{id:"AH065",c:"ah",q:"合肥综合性国家科学中心是国家创新体系建设的基础性平台。除拥有国家同步辐射实验室、合肥微尺度物质科学国家研究中心、磁约束核聚变实验室外，还启动建设了（　）国家实验室。",o:["中国聚变工程","量子信息科学","稳态强磁场","合肥先进光源"],a:1,e:"量子信息科学国家实验室依托中国科大在合肥启动建设，与同步辐射、微尺度物质科学、磁约束核聚变共同构成合肥大科学装置与国家实验室集群。（源自安徽面向全国重点高校定向招录选调生真题）",s:"省情真题·科技创新",d:3},
{id:"AH066",c:"ah",q:"2023年起，安徽省为解决耕地细碎化问题、促进适度规模经营，部署开展的改革试点是（　）。",o:["“小田变大田”改革试点","“旱改水”土地改良工程","撂荒地复垦整治行动","退林还耕专项计划"],a:0,e:"《安徽省“小田变大田”改革试点工作实施方案》通过农田建设、土地整治，把零散小田整合为大田，逐步解决耕地细碎化问题，配套发展适度规模经营，是安徽深化农村改革的重要探索。（源自2023年安徽省考面试真题素材）",s:"省情真题·乡村振兴",d:2},
/* —— 言语·成语词语（高频数据与释义引自公考加油站 gwy.dtiku.cn 真题统计） —— */
{id:"CY001",c:"yy",q:"“一条一条地分析，形容分析得有条理、很细致”的成语是（　）。",o:["条分缕析","走马观花","浮光掠影","浅尝辄止"],a:0,e:"条分缕析：一条一条地分析，形容分析得有条理、很细致。后三者均含“粗略、不深入”之义，恰与语境相反。（释义引自公考加油站真题高频统计）",s:"成语·释义",d:1},
{id:"CY002",c:"yy",q:"“水面的反光和一闪而过的影子，比喻观察粗疏不细致或学习浮泛不认真，了解不多、印象不深”指的是（　）。",o:["走马观花","浮光掠影","浅尝辄止","一目十行"],a:1,e:"浮光掠影：浮光——水面的反光；掠影——一掠而过的影子。比喻观察粗疏不细致或学习浮泛不认真。与“走马观花”近义，但更侧重“印象不深”。",s:"成语·释义",d:1},
{id:"CY003",c:"yy",q:"“略微尝试一下就停止了，形容做事、学习等不肯深入下功夫”的成语是（　）。",o:["融会贯通","浅尝辄止","锲而不舍","追本溯源"],a:1,e:"浅尝辄止：略微尝试一下就停止，形容不肯深入下功夫。锲而不舍、融会贯通与之相反。",s:"成语·释义",d:1},
{id:"CY004",c:"yy",q:"“骑在奔跑的马上看花，现比喻匆忙和粗略地观察事物”的成语是（　）。",o:["浮光掠影","走马观花","浅尝辄止","一目十行"],a:1,e:"走马观花：骑在奔跑的马上看花。原形容得意而愉快的心情，现多比喻匆忙粗略地观察事物。",s:"成语·释义",d:1},
{id:"CY005",c:"yy",q:"“走马观花”“浮光掠影”“浅尝辄止”三个成语的共同语义指向是（　）。",o:["都形容观察或学习粗略、不深入","都形容景色优美、令人流连","都形容速度快、效率高","都形容数量多、种类全"],a:0,e:"三者均有“粗略、不深入”之义：走马观花重“看得粗略”，浮光掠影重“印象不深”，浅尝辄止重“不肯深入下功夫”。此为成语辨析常考的“近义族群”记忆法。",s:"成语·辨析",d:2},
{id:"CY006",c:"yy",q:"“形容人或事物很多”的成语是（　）。它与“凤毛麟角”恰好构成反义关系。",o:["林林总总","寥寥无几","屈指可数","凤毛麟角"],a:0,e:"林林总总：形容人或事物很多。寥寥无几、屈指可数、凤毛麟角均表“少”，与题干相反。凤毛麟角更强调“珍贵而稀少”。",s:"成语·释义",d:1},
{id:"CY007",c:"yy",q:"“宾主相见时分站在庭院两边相对行礼，现比喻平起平坐、彼此对等的关系”的成语是（　）。",o:["分庭抗礼","和衷共济","平分秋色","分道扬镳"],a:0,e:"分庭抗礼：分站在庭的两边、相对行礼，比喻平起平坐、互相对立。注意它是中性词，并非“礼让”之意。",s:"成语·释义",d:2},
{id:"CY008",c:"yy",q:"他做事一向________，从不越雷池一步。横线处最恰当的成语是（　）。",o:["循规蹈矩","独树一帜","标新立异","特立独行"],a:0,e:"循规蹈矩：遵守规矩、不触及不破坏它，也形容拘泥保守、不懂变通。“从不越雷池一步”正扣其“守规矩”义。后三项均强调“与众不同、创新”，与语境相反。",s:"成语·语境",d:1},
{id:"CY009",c:"yy",q:"“独立树立起一面旗帜，比喻开创新路或自成一家，与众不同”的成语是（　）。",o:["独树一帜","独占鳌头","一枝独秀","无出其右"],a:0,e:"独树一帜：独立树立起一面旗帜，比喻开创新路或自成一家、与众不同。常与“标新立异”连用辨析：独树一帜偏成果“自成一家”，标新立异偏主张“与众不同”。",s:"成语·释义",d:1},
{id:"CY010",c:"yy",q:"“独树一帜”“标新立异”“特立独行”三个成语的共同语义指向是（　）。",o:["都强调与众不同、自成一家","都形容数量稀少、极为罕见","都强调遵守规则、按部就班","都形容技艺高超、令人赞叹"],a:0,e:"三者均含“与众不同”义：独树一帜重“自成一家”，标新立异重“提出新见解”，特立独行重“行为独特不随流”。同族群归纳记忆可提高辨析效率。",s:"成语·辨析",d:2},
{id:"CY011",c:"yy",q:"“指一经形成就不再改变”的成语是（　），其感情色彩为贬义。",o:["一成不变","亘古不变","墨守成规","始终如一"],a:0,e:"一成不变：一经形成就不再改变，含贬义（不知变通）。亘古不变、始终如一为中性偏褒；墨守成规贬义但义为“守着老规矩不肯改进”。",s:"成语·释义+色彩",d:1},
{id:"CY012",c:"yy",q:"“原指按照一定门类、依照一定次序组织文章结构，现指办事按照一定的规矩、遵循一定的程序”的成语是（　）。",o:["按部就班","循序渐进","有条不紊","环环相扣"],a:0,e:"按部就班：部——门类；班——次序。原指作文组织结构，现指按规矩程序办事。在真题中常含“缺乏创新”的贬义倾向，与“循序渐进”（褒义，强调逐步深入）辨析。",s:"成语·释义",d:2},
{id:"CY013",c:"yy",q:"“凤凰的毛，麒麟的角。比喻极为珍贵而稀少的人或事物”的成语是（　）。",o:["凤毛麟角","鳞次栉比","屈指可数","百里挑一"],a:0,e:"凤毛麟角：比喻极为珍贵而稀少的人或事物（褒义）。鳞次栉比形容房屋等排列密集，勿因“鳞”字误选。",s:"成语·释义",d:1},
{id:"CY014",c:"yy",q:"下列成语中，感情色彩均为褒义的一组是（　）。",o:["凤毛麟角、珠联璧合","一成不变、按部就班","浮光掠影、浅尝辄止","未置可否、分庭抗礼"],a:0,e:"凤毛麟角（褒）、珠联璧合（褒）。一成不变、按部就班、浮光掠影、浅尝辄止均为贬义倾向；未置可否、分庭抗礼为中性。褒贬色彩是言语题排除干扰项的常用抓手。",s:"成语·色彩",d:2},
{id:"CY015",c:"yy",q:"“不说行，也不说不行。指不发表意见，没有表明态度”的成语是（　）。",o:["未置可否","不置可否","不置褒贬","莫衷一是"],a:0,e:"未置可否：不表明态度。莫衷一是指大家意见分歧、不能得出一致结论，与“个人不表态”不同。真题中也写作“不置可否”，两者常互为干扰项。",s:"成语·释义",d:2},
{id:"CY016",c:"yy",q:"“珍珠串在一起，美玉合在一起。比喻美好的人或事物聚合在一起”的成语是（　）。",o:["珠联璧合","珠光宝气","交相辉映","相得益彰"],a:0,e:"珠联璧合：璧——美玉。比喻美好的人或事物聚合在一起（褒义），常与“相得益彰”搭配出现：“二者珠联璧合、相得益彰”。",s:"成语·释义",d:1},
{id:"CY017",c:"yy",q:"“本指顺应天命而产生，后泛指顺应某种时机、条件、需要等而产生”的成语是（　）。",o:["应运而生","顺势而为","乘势而上","油然而生"],a:0,e:"应运而生：顺应时机、条件、需要而产生，多用于新事物、新业态，是真题高频成语。油然而生指某种感情自然产生，对象是“情感”，勿混。",s:"成语·释义",d:1},
{id:"CY018",c:"yy",q:"“只有这样一个，找不出第二个来。形容唯一的、难得的”的成语是（　）。",o:["独一无二","举世无双","无与伦比","首屈一指"],a:0,e:"独一无二：唯一的、没有相同或可比的。无与伦比偏“好到没有能赶上的程度”（多形容成就、美好程度），举世无双偏“世上没有第二个”（数量），角度略有差异。",s:"成语·辨析",d:2},
{id:"CY019",c:"yy",q:"“厚：过分。非：责备。指不可以过分责备”的成语是（　）。",o:["无可厚非","无可非议","无可奈何","无可辩驳"],a:0,e:"无可厚非：虽有缺点，但可以理解或原谅（不可过分责备）。注意与“无可非议”辨析：无可非议指“完全没有可指责之处”，程度更重——言语题高频陷阱对。",s:"成语·辨析",d:2},
{id:"CY020",c:"yy",q:"“在同一时间里来谈论，指相提并论、一样看待”的成语是（　）。",o:["同日而语","等量齐观","一概而论","混为一谈"],a:0,e:"同日而语：放在同一时间谈论、一样看待，多用于否定句“不可同日而语”（前后差距大）。等量齐观指对有差别的事物同等看待，常用于否定“不可等量齐观”。",s:"成语·辨析",d:2},
{id:"CY021",c:"yy",q:"“方：正在。兴：兴起。艾：停止、完结。指事物正在兴起发展，尚未终止”的成语是（　）。",o:["方兴未艾","蒸蒸日上","如日中天","欣欣向荣"],a:0,e:"方兴未艾：事物正在兴起发展、尚未终止。它在公考真题中出现频次位居前列（安徽卷亦有考察），多用于新兴产业、新业态，褒义。",s:"成语·高频",d:1},
{id:"CY022",c:"yy",q:"“地位重要，一举一动都足以影响到全局”的成语是（　）。",o:["举足轻重","至关重要","牵一发而动全身","不可或缺"],a:0,e:"举足轻重：所处地位重要，一举一动足以影响全局。区别于“至关重要（事物本身极重要）”——举足轻重强调“地位与影响力”。",s:"成语·高频",d:1},
{id:"CY023",c:"yy",q:"“接连不断地出现，没有穷尽”的成语是（　）。",o:["层出不穷","司空见惯","屡见不鲜","源源不断"],a:0,e:"层出不穷：接连出现、没有穷尽，多指新生事物或问题。屡见不鲜、司空见惯强调“见得多了不觉得奇怪”，义在“常见”而非“频出”。",s:"成语·高频",d:1},
{id:"CY024",c:"yy",q:"“两者互相配合，双方的能力和作用更能显示出来”的成语是（　）。",o:["相得益彰","相辅相成","交相辉映","相濡以沫"],a:0,e:"相得益彰：互相配合，双方长处更能显现（重在“互相增色”）。相辅相成：互相补充、互相促成（重在“缺一不可”）。一字之差是高频考点。",s:"成语·辨析",d:2},
{id:"CY025",c:"yy",q:"“指两件事物互相配合、互相促成，缺一不可”的成语是（　）。",o:["相辅相成","相得益彰","并行不悖","互为表里"],a:0,e:"相辅相成：互相配合促成、缺一不可。与相得益彰的核心区别：“相辅相成”强调依存关系，“相得益彰”强调效果增色。",s:"成语·辨析",d:2},
{id:"CY026",c:"yy",q:"依次填入两句话横线处最恰当的一组成语是：（1）两种非遗技艺同台展演，________，现场观众大饱眼福。（2）理论与实践________，脱离实践的理论只能是空谈。",o:["相得益彰 / 相辅相成","相辅相成 / 相得益彰","交相辉映 / 并行不悖","珠联璧合 / 混为一谈"],a:0,e:"（1）句“同台展演、效果增色”→相得益彰；（2）句“缺一不可的依存关系”→相辅相成。双空辨析是近年省考言语的典型命题形式。",s:"成语·语境双空",d:3},
{id:"CY027",c:"yy",q:"“赞美所看到的事物好到极点，多用于赞叹精妙的技艺或作品”的成语是（　）。",o:["叹为观止","拍案叫绝","赞不绝口","交口称赞"],a:0,e:"叹为观止：赞美看到的事物好到极点（叹：赞叹；观止：看到这里就够了）。注意其对象是“看到的事物”，不能用于听觉艺术（如歌曲）——高频误用点。",s:"成语·高频",d:2},
{id:"CY028",c:"yy",q:"“形容彼此相差很远、大不相同”的成语是（　）。",o:["大相径庭","截然不同","天壤之别","判若两人"],a:0,e:"大相径庭：彼此相差很远、大不相同，多作贬义或中性。径——小路；庭——院子。“大相径庭”侧重“相差悬殊”，常用于观点、说法之间的差距。",s:"成语·释义",d:1},
{id:"CY029",c:"yy",q:"“把各方面的知识和道理融合贯穿在一起，从而得到全面透彻的理解”的成语是（　）。",o:["融会贯通","触类旁通","举一反三","豁然贯通"],a:0,e:"融会贯通：融合贯穿各方面知识道理，得到全面透彻理解。融会——融合领会；贯通——彻底理解。触类旁通、举一反三强调“由一类推及其他”，程度较浅。",s:"成语·释义",d:1},
{id:"CY030",c:"yy",q:"“彼此之间忧喜祸福都共同承受，形容同甘共苦、关系密切”的成语是（　）。",o:["休戚与共","休戚相关","患难与共","风雨同舟"],a:0,e:"休戚与共：祸福共享、同甘共苦。休——喜悦；戚——忧愁。“休戚相关”仅指彼此关联（程度较浅），“休戚与共”强调共同承受（程度更深），两者是高频辨析对。",s:"成语·辨析",d:2},
{id:"CY031",c:"yy",q:"依次填入最恰当的词语是：千百年来的农耕文明在江淮大地渐渐________下来，成为乡土文化最深厚的底色。",o:["积淀","积累","堆积","积攒"],a:0,e:"积淀：积累沉淀，多指思想、文化等在漫长历史中的积聚，契合“文化、文明”语境；积累为通用词；堆积、积攒偏具体物或钱财。",s:"词语·辨析",d:2},
{id:"CY032",c:"yy",q:"依次填入最恰当的词语是：这座千年古镇________着数代人的集体记忆，一砖一瓦都是乡愁的注脚。",o:["承载","承担","承受","装载"],a:0,e:"承载：承受物的重量、托物运载，常与“记忆、文化、功能、希望”等抽象宾语搭配；承担多与“责任、任务”搭配；承受多与“压力、损失”搭配；装载偏具体货物。",s:"词语·辨析",d:2},
{id:"CY033",c:"yy",q:"“经历长久的时间而更加鲜活、更有活力”的成语是（　）。",o:["历久弥新","经久不衰","老而弥坚","亘古常新"],a:0,e:"历久弥新：经历长久时间更加鲜活（弥——更加）。多形容文化、精神、作品等随时间推移更显价值，是近年真题超高频成语。",s:"成语·高频",d:1},
{id:"CY034",c:"yy",q:"“（才能、本领）全部显露出来，超出众人”的成语是（　）。",o:["脱颖而出","锋芒毕露","崭露头角","出类拔萃"],a:0,e:"脱颖而出：本领全部显露、超出众人（颖——锥子尖，锥处囊中其末立见）。崭露头角指初显才能（起步阶段），锋芒毕露常含贬义（过于外露），注意程度与色彩差异。",s:"成语·高频",d:2},

/* —— 2024/2025 安徽省考常识真题（题源：gwy.dtiku.cn，解析为本库撰写） —— */
{id:"ZT001",c:"zt",q:"（2025安徽）下列关于法规的表述正确的是（　）。",o:["国家监察委员会根据宪法、法律和行政法规，制定监察法规","《中华人民共和国军事设施保护法》和《国际军事合作工作条例》都属于军事法规","地方性法规是指各地方政府按照宪法、法律、行政法规的规定制定的规范性法律文件","党内法规是体现党的统一意志，规范党的领导和党的建设活动、依靠党的纪律保证实施的专门规章制度"],a:3,e:"D项为党内法规的准确定义。A错：国家监委制定监察法规的依据是宪法和法律（经全国人大常委会授权），并不依据行政法规；B错：《军事设施保护法》是全国人大常委会制定的法律，只有《国际军事合作工作条例》是中央军委制定的军事法规；C错：地方性法规由地方人大及其常委会制定，地方政府制定的叫“政府规章”。",s:"2025安徽真题·法律",d:2},
{id:"ZT002",c:"zt",q:"（2025安徽）个人信息应受法律保护，下列做法符合个人信息保护法律规定的是（　）。",o:["某县政府网站“信息公开”栏目公布农机购置补贴发放情况，内容包括购机农户姓名、身份证号、购机型号、银行账号等基本情况","某音乐视频教学类APP要求使用者授权其照片、文件、手机设备号、人脸等信息才提供其产品和服务，使用者同意该授权","某住户与同层邻居一起团购可视门铃，分别安装在自己家门口，不仅能看到自家门前情况，也能看到邻居家门前情况","某小区以刷脸作为业主出入小区的唯一验证方式，不同意某业主提出的使用密码、门禁卡等其他验证方式的要求"],a:2,e:"C项可视门铃安装于自家门口、拍摄公共楼道属于合理范围。A错：公开身份证号、银行账号远超必要限度；B错：“不同意授权就不提供服务”违反处理个人信息应遵循的必要原则（捆绑授权无效）；D错：以刷脸为唯一验证方式剥夺了个人对敏感个人信息的处理选择权。",s:"2025安徽真题·法律",d:2},
{id:"ZT003",c:"zt",q:"（2025安徽）下列案例中，当事人的主张能够获得法院支持的是（　）。",o:["王某以妻子未经自己同意擅自流产为由，主张妻子侵犯自己的生育权，要求进行损害赔偿","张某与妻子离婚时，以女方一天也没有回家住过为由，主张返还按照习俗给付的18万元彩礼","李某认为自己在婚后通过转让发明专利获得的收入为个人财产，主张不能用于偿还夫妻共同债务","某父母为已婚女儿出资购房，并约定房屋为女儿所有，其女婿孙某离婚时主张该房屋属于家庭共同财产"],a:1,e:"B项符合司法解释：双方办理结婚登记但确未共同生活的，离婚时彩礼应予返还。A错：生育权具有人身专属性，妻子对是否生育有最终决定权；C错：婚后知识产权收益属夫妻共同财产；D错：父母出资购房且明确约定归女儿一方，视为对一方的赠与，属女儿个人财产。",s:"2025安徽真题·法律",d:3},
{id:"ZT004",c:"zt",q:"（2025安徽）某商业银行拟为具有1年投资经历的客户李某提供理财服务，下列做法符合规定的是（　）。",o:["向李某介绍理财产品的预期收益率","允许李某提前赎回其所购买的封闭式理财产品","向李某销售高于李某风险承受能力等级的理财产品","其理财子公司在李某首次购买相关理财产品前通过电子渠道评估李某风险承受能力"],a:3,e:"资管新规与理财监管要求：首次购买前必须进行风险承受能力评估（线上线下均可），D正确。A错：禁止宣传“预期收益率”误导保本保收益；B错：封闭式产品封闭期内不能提前赎回；C错：坚持风险匹配原则，不得向客户销售高于其风险承受等级的产品。",s:"2025安徽真题·金融法律",d:2},
{id:"ZT005",c:"zt",q:"（2025安徽）某日人民币兑美元中间价报7.1101，一月前报6.8928。下列相关说法正确的是（　）。",o:["人民币兑美元中间价属于人民币在岸价","相较于一月前，人民币兑美元是相对升值","中国证券监督管理委员会是负责全国外汇市场的监督管理机构","人民币兑美元中间价为银行间外汇市场中人民币兑美元汇率的算术平均值"],a:0,e:"中间价由中国外汇交易中心（位于境内银行间市场）公布，属在岸价，A正确。B错：同样的美元兑更多人民币（6.8928→7.1101），人民币相对贬值；C错：外汇市场监管由中国人民银行及国家外汇管理局负责；D错：中间价由做市商报价加权并引入“收盘价+一篮子货币汇率变化+逆周期因子”机制形成，并非简单算术平均。",s:"2025安徽真题·经济",d:3},
{id:"ZT006",c:"zt",q:"（2025安徽）下列关于我国重要历史文物的叙述错误的是（　）。",o:["青铜器“利簋”又名“武王征商簋”，其铭文记载了武王伐纣这一历史事件","三星堆遗址出土了青铜大立人像、青铜神树、金面罩等珍贵文物","新疆出土的汉代织锦护臂，织有“五星出东方利中国”八字","位于陕西西安的半坡遗址出土了嵌绿松石象牙杯"],a:3,e:"嵌绿松石象牙杯出土于河南安阳殷墟妇好墓，是商代青铜文明巅峰之作；半坡遗址（西安，仰韶文化）的明星文物是人面鱼纹彩陶盆。A、B、C均正确：利簋铭文实证牧野之战，三星堆青铜神树举世闻名，“五星出东方利中国”护臂为新疆尼雅遗址出土的国宝。",s:"2025安徽真题·文物",d:2},
{id:"ZT007",c:"zt",q:"（2025安徽）下列有关中国古代建筑的说法错误的是（　）。",o:["楼是“重屋”，指的是两层及以上的建筑物","阁是一种半开放的建筑，常建于水边供人们赏景","舫是仿照船型而造的一种建筑，又被称为“不系舟”","亭一般为开敞性结构，没有围墙，顶部可分为六角、八角等形状"],a:1,e:"“半开放、临水赏景”说的是榭（水边曰榭），B张冠李戴。阁通常指藏书、供佛的多层建筑（如滕王阁、藏书阁），与楼同为“重屋”但功能有别。C正确：舫如苏州拙政园香洲，泊于岸而不系缆，故称“不系舟”；D正确：亭者停也，供休憩观景，四面开敞。",s:"2025安徽真题·古建筑",d:2},
{id:"ZT008",c:"zt",q:"（2025安徽）下列诗文涉及的人物或事件对应的时期错误的是（　）。",o:["合从离衡，佩印者六——战国","饮马瀚海，封狼居胥——东汉","被遇神宗，致位宰相——北宋","血战歼倭，勋垂闽浙——明朝"],a:1,e:"“饮马瀚海，封狼居胥”说的是西汉霍去病：远征漠北、在狼居胥山祭天封礼，B把西汉误作东汉。“合从离衡”指战国苏秦佩六国相印合纵抗秦；“被遇神宗，致位宰相”指北宋王安石受神宗重用推行变法；“血战歼倭，勋垂闽浙”指明代戚继光台州、福建抗倭。",s:"2025安徽真题·诗文典故",d:2},
{id:"ZT009",c:"zt",q:"（2025安徽）关于伽马射线和伦琴射线（X射线），下列说法错误的是（　）。",o:["这两种射线都属于电磁波","伽马射线的辐射性较强，不能用于食品杀菌","伦琴射线可用于CT（电子计算机断层扫描）检查中","这两种射线的辐射伤害可以用不同厚度的铅板来阻挡"],a:1,e:"B恰恰说反了：伽马射线（如钴-60辐照技术）正是食品杀菌保鲜的成熟手段，辐照后的食品无残留放射性、安全可靠。A正确：二者均为电磁波（伽马波长更短、能量更高）；C正确：CT即用X射线断层扫描；D正确：铅板是标准辐射屏蔽材料。",s:"2025安徽真题·物理",d:2},
{id:"ZT010",c:"zt",q:"（2025安徽）下列选项与无线充电器主要工作原理相同的是（　）。",o:["微波炉","电磁炉","电热毯","电熨斗"],a:1,e:"无线充电（Qi标准）与电磁炉同用电磁感应原理：变化的电流通过线圈产生交变磁场，接收端感应出电流。微波炉靠微波使食物中水分子剧烈振动摩擦生热；电热毯、电熨斗则是电流的热效应（电阻发热）。",s:"2025安徽真题·物理",d:1},
{id:"ZT011",c:"zt",q:"（2025安徽）藻蓝蛋白是一种可从螺旋藻中提取分离得到的色素蛋白。以下关于藻蓝蛋白说法错误的是（　）。",o:["藻蓝蛋白在强酸环境下不稳定","藻蓝蛋白是一种可食用的天然色素","藻蓝蛋白至少由C、H、O、N四种元素组成","藻蓝蛋白呈现蓝色是由于其吸收了蓝光的缘故"],a:3,e:"物质呈蓝色是因为它选择性吸收了互补色光（红光区），而将蓝光反射/透射出来被人眼看到——D把因果说反。A正确：蛋白质类色素在强酸强碱中易变性失稳；B正确：藻蓝蛋白是常见的天然食用色素；C正确：蛋白质含C、H、O、N等元素。",s:"2025安徽真题·化学",d:2},
{id:"ZT012",c:"zt",q:"（2025安徽）细菌A能产生水解氨苄青霉素的酶而具有抗性，细菌B没有。将二者一起培养后，部分细菌B也获得了抗性，且其子代均具有抗性。由此可以推断，细菌B获得了细菌A的（　）。",o:["DNA","RNA","蛋白质","氨苄青霉素"],a:0,e:"抗性基因位于质粒DNA上，可通过转化/接合在细菌间水平转移；且“子代均具有抗性”说明该性状可随DNA复制稳定遗传——只有DNA符合。若是蛋白质则不能自我复制遗传给子代；RNA也不构成细菌的稳定遗传物质。",s:"2025安徽真题·生物",d:2},
{id:"ZT013",c:"zt",q:"（2025安徽）以下关于我国航母的说法错误的是（　）。",o:["目前我国列装的航母满载排水量均超过5万吨","“福建舰”是我国自主建造的弹射型国产航母，采用平直通长飞行板","我国首艘国产航母“辽宁舰”于2012年入列，目前已形成体系作战能力","2019年12月，中国第二艘航母被正式命名为“山东舰”，突破了船体结构、动力核心设备等重大技术瓶颈"],a:2,e:"C混淆了两舰：辽宁舰由乌克兰“瓦良格”号续建改装，是我国首艘航母而非首艘国产航母；首艘国产航母是山东舰（2019年入列）。A正确：三舰满载排水量均超5万吨；B正确：福建舰为平直通长飞行甲板+电磁弹射；D正确。",s:"2025安徽真题·国防科技",d:2},
{id:"ZT014",c:"zt",q:"（2025安徽）“超级满月”是月球位于近地点时刚好出现满月的现象。其发生需要满足的条件是（　）。",o:["农历初一前后，地球运动到太阳与月球之间","农历初一前后，月球运动到太阳与地球之间","农历十五前后，地球运动到太阳与月球之间","农历十五前后，月球运动到太阳与地球之间"],a:2,e:"满月必在农历十五前后，且此时地球位于太阳与月球之间（日—地—月近似一线），阳光照亮月球整个朝向地球的半球——C正确。农历初一前后是新月，月球位于太阳与地球之间（B/D所述），看不到月亮。叠加“月球位于近地点”即成超级满月。",s:"2025安徽真题·天文地理",d:2},
{id:"ZT015",c:"zt",q:"（2025安徽）以下生活常识正确的是（　）。",o:["飞机舷窗采用椭圆状设计可以减少飞机内外压力差","如果汽车挡风玻璃出现小裂缝，可以通过在裂纹末尾钻一个适当大小的洞来阻止裂缝的扩散","在地面上将一堆苹果堆成圆锥状，底部正中央的那个苹果，受到的压力最大，最容易被压坏","往烧得通红的滚烫铁板上滴几滴水，如果看到水滴悬浮在空中，没有马上蒸发，是因为铁板温度不够高"],a:1,e:"B是经典的“止裂孔”技术：在裂纹末端钻孔可分散应力集中，阻止裂纹继续延伸。A错：舷窗椭圆设计是为了避免应力集中在尖角，不是减少压差本身；C错：锥形堆底部中央所受压力并非最大（堆体像拱桥把力导向四周）；D错：水滴悬浮是莱顿弗罗斯特效应——铁板温度极高时蒸汽膜把水滴托起，恰恰说明温度够高。",s:"2025安徽真题·生活物理",d:2},
{id:"ZT016",c:"zt",q:"（2024安徽）下列所描述现象与相关专业术语对应正确的是（　）。",o:["某商品的价格越高，其需求量越大——价值悖论","工资率随劳动供求的变动而及时迅速地变动——工资粘性","人们倾向于将从小样本中得到的结论错误地移植到大样本中——小数定律","在完全竞争的市场上，相同交易产品经过汇率调整后，在世界范围内其交易成本是相同的——一价定律"],a:3,e:"D正确：一价定律指完全竞争与无套利条件下，同一商品经汇率折算后各地价格趋同，是购买力平价理论的基石。A错：价格越高需求越大对应“吉芬商品”（或凡勃伦效应），价值悖论指“水有用却便宜、钻石无用却昂贵”；B错：工资粘性指工资不能随供求及时调整，“及时迅速变动”恰是它的反面；C错：小数定律指误以为小样本能代表总体。",s:"2024安徽真题·经济",d:3},
{id:"ZT017",c:"zt",q:"（2024安徽）下列关于贷款市场报价利率（LPR）说法错误的是（　）。",o:["目前LPR只有1年期和5年期以上两个期限品种","当LPR下降后，商业性个人住房贷款的最新一期月供也会下降","LPR是由中国人民银行授权全国银行间同业拆借中心计算并公布的基础性的贷款参考利率","新发放的商业性个人住房贷款利率是以最近一个月相应期限的LPR为定价基准加点形成"],a:1,e:"B忽略了“重定价周期”：已放款的存量房贷要到重定价日（多为每年1月1日或贷款对应日）才按最新LPR调整月供，并非LPR一降当期月供立即下降。A、C、D均为LPR机制的正确表述。",s:"2024安徽真题·金融",d:2},
{id:"ZT018",c:"zt",q:"（2024安徽）下列情况属于可经指派获得法律援助的是（　）。①15岁的学生小明涉嫌贩卖毒品，没有委托辩护人 ②25岁的精神病人赵某涉嫌抢劫，其患病多年经济困难，没有委托辩护人 ③35岁的村民张某因向村中水井投毒，可能被判处死刑，没有委托辩护人 ④45岁的聋哑人李某创设公司后涉嫌逃税罪，其个人资产过亿，没有委托辩护人",o:["①②③","②③④","①③④","①②③④"],a:3,e:"刑事法律援助的“应当通知指派”情形不以经济困难为前提：未成年人（①）、精神病人（②）、可能被判处无期、死刑（③）、盲聋哑人（④）没有委托辩护人的，法院、检察院、公安机关应当通知法律援助机构指派律师——四项全部符合，选D。",s:"2024安徽真题·法律",d:2},
{id:"ZT019",c:"zt",q:"（2024安徽）古人名与字的含义通常有一定关联，或相同相近，或相关相辅，或相反相成。下列历史人物名与字的对应关系与其他三项不同的是（　）。",o:["曹丕，字子桓","周瑜，字公瑾","杜甫，字子美","朱熹，字元晦"],a:3,e:"前三位都是“相近相成”：丕与桓皆有“大”义；瑜、瑾同为美玉；甫即美。唯有朱熹字元晦是“相反相成”——熹是晨光明亮，晦是日暮昏暗，一明一暗互为注脚。",s:"2024安徽真题·人文",d:2},
{id:"ZT020",c:"zt",q:"（2024安徽）下列诗句中涉及的典故人物与其时代对应不正确的一项是（　）。",o:["林暗草惊风，将军夜引弓。平明寻白羽，没在石棱中——西汉","闲来垂钓碧溪上，忽复乘舟梦日边——先秦","怀旧空吟闻笛赋，到乡翻似烂柯人——东汉","求田问舍，怕应羞见，刘郎才气——三国"],a:2,e:"C错在“东汉”：“闻笛赋”指向秀怀念嵇康、吕安所作《思旧赋》，“烂柯人”用王质观棋烂柯的传说，均属魏晋时期。A正确：卢纶《塞下曲》咏西汉李广射石没镞；B正确：垂钓碧溪用姜太公渭水遇文王典故（先秦）；D正确：许汜“求田问舍”遭刘备讥讽（三国）。",s:"2024安徽真题·诗文典故",d:3},
{id:"ZT021",c:"zt",q:"（2024安徽）下列选项描述的历史场景与时代不符的是（　）。",o:["唐玄宗时期，百姓可以在祠堂祭拜祖先","南宋时期，人们可以到商业街购买东西","永乐年间，大部分州县由粮长负责征解税粮","道光年间，福建、广东等地的百姓可以用银元完纳钱粮"],a:0,e:"A不符：唐代“家庙”是品官特权，庶民只能祭于寝（家中正屋）；民间祠堂的普及要到南宋朱熹《家礼》倡导之后。B正确：南宋打破坊市界限、临安商业繁盛；C正确：明代永乐行粮长制；D正确：道光年间外国银元（洋钱）在闽粤流通，可完纳税粮。",s:"2024安徽真题·历史",d:3},
{id:"ZT022",c:"zt",q:"（2024安徽）戏曲是中华优秀传统文化的重要组成部分，下列有关说法错误的是（　）。",o:["京剧、豫剧、评剧、黄梅戏、越剧是中国戏剧五大剧种","《群英会》是依据《水浒传》改编的传统京剧","黄梅戏代表剧目中有《天仙配》和《女驸马》","豫剧与梆子腔关系紧密"],a:1,e:"B张冠李戴：《群英会》演的是赤壁之战蒋干盗书、草船借箭，改编自《三国演义》。A正确：五大剧种即京剧、豫剧、评剧、黄梅戏、越剧；C正确：黄梅戏双璧正是《天仙配》《女驸马》；D正确：豫旧称“河南梆子”，属梆子腔系统。",s:"2024安徽真题·戏曲",d:1},
{id:"ZT023",c:"zt",q:"（2024安徽）瑟是我国古代弦乐器，弦发出的音与弦的粗细和张力有关。以下选项没有体现这一原理的是（　）。",o:["《礼记·乐记》：清庙之瑟，朱弦而疏越，壹倡而三叹，有遗音者也","《韩非子·外储说左下》：夫瑟以小弦为大声，以大弦为小声","《月令章句》：瑟前其柱则清，却其柱则浊","《春诸纪闻》：缓其商弦，与宫同音"],a:0,e:"A“朱弦而疏越”说的是清庙之瑟的质朴音品与一唱三叹的余韵，并未涉及弦的粗细张力决定音高。B正是粗细之辨：弦细则音清亮、弦粗则音沉浊；C是柱位移动改变有效弦长（张力）：前移则音清、后退则音浊；D“缓其商弦与宫同音”是放松弦（降张力）使商音降为宫音。",s:"2024安徽真题·古代科技",d:3},
{id:"ZT024",c:"zt",q:"（2024安徽）下列不属于宝石形成机制的是（　）。",o:["由炽热岩浆喷发所生成的熔岩蒸汽冷凝产生","岩浆冷却凝固时浓缩的成分结晶后形成","在地核内部高温高压变质瘤结成型","从岩浆产生的热液中结晶生长"],a:2,e:"宝石形成于地壳而非地核：岩浆冷却结晶（B）、热液结晶（D）、火山蒸汽冷凝（A）都是真实机制；C错在地核——人类钻井最深仅十余公里，远未触及地核，且宝石也非地核产物。常见宝石如钻石形成于地幔深部随火山活动带到地表，但仍属岩石圈范围。",s:"2024安徽真题·地质",d:2},
{id:"ZT025",c:"zt",q:"（2024安徽）酶是具有高度特异性和高度催化效能的生物催化剂。以下有关酶的添加应用对应错误的是（　）。",o:["白酒——淀粉酶","果汁——纤维素酶","脱脂奶——乳糖酶","加酶洗衣粉——蛋白酶"],a:2,e:"C对应错误：脱脂奶靠离心分离去除乳脂肪，与乳糖酶无关；乳糖酶的用武之地是生产“无乳糖牛奶”（水解乳糖，供乳糖不耐受人群）。A正确：淀粉酶把粮食淀粉糖化成可发酵糖；B正确：纤维素酶/果胶酶分解果肉细胞壁出汁澄清；D正确：蛋白酶分解奶渍、血渍等蛋白污渍。",s:"2024安徽真题·生物化学",d:2},
{id:"ZT026",c:"zt",q:"（2024安徽）小明被困在无人、无食物来源但有淡水的荒岛上，等待救援期间从相同重量的葡萄、馒头、酸奶、花生仁中选择一种食物。为了生存时间最长，他应选择（　）。",o:["葡萄","馒头","酸奶","花生仁"],a:3,e:"生存的关键是能量密度：花生仁约50%是脂肪，每100克热量约2400千焦以上，远超馒头（淀粉为主）、酸奶（大量水分）、葡萄（近九成是水）。同样的重量，花生仁带来的“口粮续航”最长——这就是户外圈“带脂肪不带碳水”的常识。",s:"2024安徽真题·生活生物",d:1},
{id:"ZT027",c:"zt",q:"（2024安徽）下列表述不符合物理常识的是（　）。",o:["一杯泡好的茶，用勺子作圆形搅动，茶叶会向杯底中心聚集","用洗衣机洗裤子并脱干后，取出时经常会看到裤兜被翻出来","在河流的弯道上，外圈河床要比内圈浅，因为泥沙会被河水带到外圈","锅里剩下最后几根面条时，用筷子在锅中作圆形搅动，面汤旋转起来后面条会集中到锅底中心"],a:2,e:"C说反了：弯道水流受离心作用冲刷凹岸（外侧），外圈河床反而更深；泥沙在流速较慢的凸岸（内圈）沉积变浅——“凹岸侵蚀、凸岸堆积”。A、D是二次流现象：旋转茶汤底部摩擦减速，茶叶被卷向中心；裤兜翻出是脱水时衣物贴壁、兜布自由滞后被“甩”出来。",s:"2024安徽真题·物理",d:2},
{id:"ZT028",c:"zt",q:"（2024安徽）梨果仙人掌原产于中美洲墨西哥，适应干燥、蒸发强烈、土地干旱的热带环境，却在我国亚热带横断山脉的干热河谷内大量野生繁衍。由此判断影响该河谷的气候效应是（　）。",o:["狭管效应","温室效应","阳伞效应","焚风效应"],a:3,e:"焚风效应：气流翻越山脉在背风坡下沉，按干绝热规律每降百米升温约1℃，同时湿度骤降，形成又干又热的“火烤”谷地——横断山脉干热河谷正是其教科书案例。狭管效应只管“风大”不管“干热”；温室效应是保温气体截留长波辐射；阳伞效应是尘埃云雾削弱太阳辐射。",s:"2024安徽真题·地理",d:2},

/* —— 成语进阶（续自公考加油站安徽高频统计，释义生动化改写） —— */
{id:"CY035",c:"yy",q:"他闭关十年、遍读典籍，此番出山讲学________，令四座皆惊。横线处最恰当的成语是（　）。",o:["厚积薄发","急于求成","浅尝辄止","一目十行"],a:0,e:"厚积薄发像地下的竹笋：前四年只长三厘米，根系却在土里铺开几百米，第五年便以每天几十厘米的速度拔节——十年闭关是“厚积”，出山惊艳是“薄发”。苏轼“博观而约取，厚积而薄发”正是此意。",s:"成语·语境",d:2},
{id:"CY036",c:"yy",q:"“超出同类之上，多形容人的品德、学识、才能”的成语是（　）。",o:["出类拔萃","崭露头角","鹤立鸡群","独占鳌头"],a:0,e:"出类拔萃像沙里淘出的金子：同类之中一下子“拔”出来、“萃”出来。注意程度阶梯——崭露头角只是“初露锋芒”，出类拔萃已是“出圈领先”，鹤立鸡群偏视觉上的显眼。",s:"成语·释义",d:1},
{id:"CY037",c:"yy",q:"“把不同的人或不同的事物放在一起谈论或看待”的成语是（　），多用于否定句中。",o:["相提并论","同日而语","等量齐观","混为一谈"],a:0,e:"相提并论=摆到同一张桌子上称分量。三兄弟辨析：相提并论重“一起看待”，同日而语重“同一时间维度比较”（差距随时间拉大时用），等量齐观重“同等衡量有差别的事物”。常考“不可/岂能”开头。",s:"成语·辨析",d:2},
{id:"CY038",c:"yy",q:"“内容深刻，表达的语言却浅显易懂”的成语是（　）。",o:["深入浅出","通俗易懂","言简意赅","微言大义"],a:0,e:"深入浅出像优秀的讲解员：一头扎进深水摸鱼，端上桌的却是一盘人人夹得动的家常菜。微言大义恰好是它的镜像——话不多，分量重。",s:"成语·释义",d:1},
{id:"CY039",c:"yy",q:"他在图书馆伏案疾书，窗外市声鼎沸也浑然不觉，真是________。横线处最恰当的成语是（　）。",o:["心无旁骛","三心二意","心猿意马","魂不守舍"],a:0,e:"心无旁骛像激光与灯泡的区别：灯泡的光四散照亮全屋，激光只朝一点——“骛”是追逐，心里没有第二个追赶的目标，市声再吵也进不了他的耳朵。后三项全是贬义的“分心”。",s:"成语·语境",d:1},
{id:"CY040",c:"yy",q:"“形容理论、学识、思想等广博深奥”的成语是（　），常用于形容中华优秀传统文化。",o:["博大精深","浩如烟海","包罗万象","汗牛充栋"],a:0,e:"博大精深是“宽与深”的十字交叉：像一口古井，井口不大却深不见底。浩如烟海只说数量多；包罗万象只说范围广；汗牛充栋专指藏书。四者常互为干扰项。",s:"成语·释义",d:1},
{id:"CY041",c:"yy",q:"“比喻做事认真踏实，实事求是”的成语是（　）。",o:["脚踏实地","兢兢业业","恪尽职守","埋头苦干"],a:0,e:"脚踏实地是最朴素的画面：双脚踩在实地上，一步一个脚印，与“一步登天”“凌空蹈虚”相对。它强调不虚浮；兢兢业业偏小心谨慎，语义不同。",s:"成语·释义",d:1},
{id:"CY042",c:"yy",q:"“比喻人的仪表或才能在一群人中显得非常突出”的成语是（　）。",o:["鹤立鸡群","出类拔萃","凤毛麟角","百里挑一"],a:0,e:"想象一只白鹤站在鸡群里——不用开口，身量先赢了，这就是鹤立鸡群的画面感。它偏“显眼、高出同伴”；凤毛麟角强调稀少珍贵；出类拔萃强调超越。",s:"成语·辨析",d:1},
{id:"CY043",c:"yy",q:"“形容声音突然终止”的成语是（　），只用于声音戛然中断。",o:["戛然而止","抑扬顿挫","如泣如诉","余音绕梁"],a:0,e:"戛然像唱片被猛地掀起了唱针——上一秒乐声正酣，下一秒万籁俱寂。注意对象限定：只能形容声音，不能说“会议戛然而止”（可用“中止”）。这是高频误用点。",s:"成语·用法",d:2},
{id:"CY044",c:"yy",q:"面对上千万元的资金缺口，各方凑来的几万元捐款虽然珍贵，却难免________。横线处最恰当的成语是（　）。",o:["杯水车薪","雪中送炭","无济于事","于事无补"],a:0,e:"杯水车薪的画面极具冲击力：一辆柴车烧成火海，你端来一杯水泼上去——火苗连眨都没眨一下。它妙在“有帮助但远远不够”；若说“完全没用”，则选“无济于事”。",s:"成语·语境",d:2},
{id:"CY045",c:"yy",q:"“比喻解决问题不从根本入手，方法错误，毫无效果”的成语是（　）。",o:["扬汤止沸","釜底抽薪","火上浇油","雪上加霜"],a:0,e:"扬汤止沸是“越忙越白忙”的典型：锅里水开了，你一勺勺舀起来再倒回去，水温纹丝不动。它的反义词恰是釜底抽薪——不跟开水较劲，直接抽掉柴火。一扬一抽，天壤之别。",s:"成语·释义",d:2},
{id:"CY046",c:"yy",q:"“比喻在矛盾中增加激化的因素，使事态更加严重”的成语是（　）。",o:["火上浇油","雪上加霜","落井下石","推波助澜"],a:0,e:"火上浇油对着火苗浇油——火借油势直窜房梁。三胞胎辨析：火上浇油是主动使坏、雪上加霜是祸不单行（被动叠加）、落井下石是乘人之危再踩一脚。",s:"成语·辨析",d:2},
{id:"CY047",c:"yy",q:"“形容内容非常丰富，应有尽有，无所不包”的成语是（　）。",o:["包罗万象","琳琅满目","五花八门","形形色色"],a:0,e:"包罗万象像一张把天地万物都兜进去的大网——“包”是动作，“罗”是网罗，森罗万象尽入彀中。琳琅满目只形容美好的具体物品多；五花八门偏花样多、变化多。",s:"成语·辨析",d:2},
{id:"CY048",c:"yy",q:"“形容顾虑太多，做事犹豫不决”的成语是（　）。",o:["瞻前顾后","深思熟虑","未雨绸缪","三思而行"],a:0,e:"瞻前顾后的画面是一个人站在原地脖子转成电风扇：向前看看怕坑，向后看看怕追兵，脚下却一步没挪。它如今多含贬义（优柔寡断）；深思熟虑、三思而行是褒义的谨慎。",s:"成语·释义",d:1},
{id:"CY049",c:"yy",q:"工程历时五年，眼看即将竣工，却因一笔资金迟迟不到位而________，令人扼腕。横线处最恰当的成语是（　）。",o:["功亏一篑","功败垂成","前功尽弃","半途而废"],a:0,e:"功亏一篑的“篑”是盛土的筐——九层之台只差最后一筐土，偏偏停了工，功败垂成与它近义；但“前功尽弃”强调此前的功劳全部白费（范围更大），“半途而废”泛指有始无终。差“最后一口气”时首选功亏一篑。",s:"成语·语境辨析",d:2},
{id:"CY050",c:"yy",q:"夜幕下，两岸灯火与江中倒影________，构成一幅流动的画卷。横线处最恰当的成语是（　）。",o:["交相辉映","相得益彰","相辅相成","珠联璧合"],a:0,e:"交相辉映是光与光的对话：灯照水、水映灯，你中有我、我中有你，专用于光色景物互相映照。相得益彰是人或事物配合后长处更明显，对象不同。",s:"成语·语境",d:2},
{id:"CY051",c:"yy",q:"“清除旧思想，改变旧面貌，比喻彻底悔改”的成语是（　），对象只能是人。",o:["洗心革面","脱胎换骨","改头换面","面目全非"],a:0,e:"洗心革面是给灵魂做的大扫除：把心里的尘埃洗净，把脸上的旧皮换掉，从此是新人。注意三个陷阱：改头换面只换表面不换里子（贬义）；面目全非指变化大到认不出（贬义）；脱胎换骨也可指彻底转变但偏重“重塑”。",s:"成语·用法",d:2},
{id:"CY052",c:"yy",q:"“形容差别很大、完全不同”的成语是（　）。",o:["迥然不同","大相径庭","天壤之别","截然不同"],a:0,e:"迥然的“迥”就是“差得远”。四胞胎常混：迥然不同、截然不同都指“根本不一样”；大相径庭多形容彼此差距悬殊（观点、说法）；天壤之别用天上地下作比，差距感最强。",s:"成语·辨析",d:2},
{id:"CY053",c:"yy",q:"“直截了当地说出内心的话，丝毫不加掩饰”的成语是（　）。",o:["直言不讳","仗义执言","快人快语","畅所欲言"],a:0,e:"直言不讳像一柄不拐弯的剑：心里怎么想，嘴上就怎么出，不绕弯、不留情面。它与“讳莫如深”（把事情藏得严严实实）恰成一对反义镜像。",s:"成语·释义",d:1},
{id:"CY054",c:"yy",q:"“比喻自己做的事限制了自己的发展，也比喻自己束缚自己”的成语是（　）。",o:["作茧自缚","画地为牢","自食其果","咎由自取"],a:0,e:"春蚕吐丝本为护身，一层层绕下来却把自己封死在茧里——作茧自缚的讽刺就在“保护变成了囚禁”。画地为牢偏“自我限定范围”；自食其果、咎由自取强调“承担后果”。",s:"成语·释义",d:2},
{id:"CY055",c:"yy",q:"会上专家们各执一词，争论半天仍________。横线处最恰当的成语是（　）。",o:["莫衷一是","无所适从","各抒己见","众说纷纭"],a:0,e:"莫衷一是的“衷”是折中判断——大家你一言我一语，谁也说服不了谁，最终“定不下来一个对的”。主语必须是群体。各抒己见、众说纷纭只描述“说开了”，不强调“没结论”；无所适从是听的人不知听谁的。",s:"成语·语境",d:2},
{id:"CY056",c:"yy",q:"“形容色彩纷繁，形态奇特；也形容事物离奇多变”的成语是（　）。",o:["光怪陆离","五彩缤纷","斑驳陆离","五花八门"],a:0,e:"光怪陆离像深夜的霓虹迷宫：光影怪异、色彩交错，越看越不真切。它自带“离奇、不真实”的滤镜；五彩缤纷只是纯粹的色彩绚丽（褒义）；斑驳陆离偏色彩杂色错落。",s:"成语·辨析",d:2},
{id:"CY057",c:"yy",q:"“形容思想保守，守着老规矩不肯改变”的成语是（　），其中“墨守”源自战国善于守城的墨翟。",o:["墨守成规","固步自封","胶柱鼓瑟","一成不变"],a:0,e:"墨守成规藏着一个冷知识：战国墨子最会守城，人称“墨守”，本是技术流——后人却把它用成了贬义的“死守老办法”。固步自封偏“自我设限不求进取”；胶柱鼓瑟（把瑟的弦柱粘死再弹）比喻不知变通，最生僻也最常当干扰项。",s:"成语·典故",d:2},
{id:"CY058",c:"yy",q:"“形容事情很紧迫，就在眼前”的成语是（　）。",o:["迫在眉睫","刻不容缓","燃眉之急","迫不及待"],a:0,e:"迫在眉睫的“睫”是眼睫毛——事情已经压到睫毛上了，眨眼就到。辨析：迫在眉睫重“近在眼前”，刻不容缓重“一分钟都不能等”，燃眉之急是名词性的“急事本身”，迫不及待是人的心理。",s:"成语·辨析",d:2},
{id:"CY059",c:"yy",q:"“比喻事情错综复杂，令人迷惑”的成语是（　），源自《木兰辞》“雄兔脚扑朔，雌兔眼迷离”。",o:["扑朔迷离","盘根错节","雾里看花","眼花缭乱"],a:0,e:"《木兰辞》里提着兔子耳朵悬空一提：雄兔脚扑腾、雌兔眼眯缝——拎在半空根本分不出公母，这才是扑朔迷离的原画面。盘根错节偏关系交织；眼花缭乱是看的人乱了，不是事情本身复杂。",s:"成语·典故",d:2},
{id:"CY060",c:"yy",q:"学习没有捷径，唯有________，方能日有所进。横线处最恰当的成语是（　）。",o:["循序渐进","按部就班","一步登天","齐头并进"],a:0,e:"循序渐进是爬楼梯哲学：一级台阶一级台阶地上，急不得也跳不得。它与按部就班的分界线在于感情色彩——循序渐进是褒义的“遵循规律”，按部就班常带贬义的“机械照流程”。",s:"成语·语境",d:1},
{id:"CY061",c:"yy",q:"“同时进行，互不冲突”的成语是（　）。",o:["并行不悖","相安无事","并驾齐驱","分庭抗礼"],a:0,e:"并行不悖像双轨列车：两条铁轨各自跑各自的列车，谁也不撞谁。它强调“可以同时成立”；并驾齐驱是“齐头并进不相上下”；分庭抗礼是“平起平坐互相对立”。",s:"成语·释义",d:2},
{id:"CY062",c:"yy",q:"“比喻事物虽然各个不同，却一样美好，或有一样的效果”的成语是（　）。",o:["异曲同工","殊途同归","不谋而合","如出一辙"],a:0,e:"异曲同工是音乐的隐喻：两支不同的曲子，听来同样动人。殊途同归重“路不同、终点同”；不谋而合重“没商量却一致”；如出一辙重“像同一个模子（贬义居多）”。",s:"成语·辨析",d:2},
{id:"CY063",c:"yy",q:"“形容对事物了解得十分清楚”的成语是（　）。",o:["了如指掌","如数家珍","一目了然","心中有数"],a:0,e:"了如指掌的画面是自己摊开手掌给人看——每条纹路都在眼前，清清楚楚。如数家珍像数自家收藏的珍宝（强调熟悉）；一目了然而是一眼看明白（强调简单直观）。",s:"成语·辨析",d:1},
{id:"CY064",c:"yy",q:"“形容说话办事很恰当，很有分寸”的成语是（　）。",o:["恰如其分","恰到好处","适可而止","过犹不及"],a:0,e:"恰如其分的“分”是分寸——话说到哪一句为止、劲用到哪一寸为止，多一分则过、少一分则欠。恰到好处偏结果“正好”；适可而止是劝人“到此为止”；过犹不及是道理“做过头等于没做”。",s:"成语·辨析",d:2},
{id:"CY065",c:"yy",q:"“另外开辟一条路，比喻开创新风格、新方法”的成语是（　）。",o:["另辟蹊径","独辟蹊径","标新立异","别出心裁"],a:0,e:"另辟蹊径是大路拥挤时的小路智慧——主路堵成停车场，侧边小道一脚油门先到。独辟蹊径强调“独自”开辟；别出心裁重“设计构思新”；标新立异有时暗贬“为不同而不同”。",s:"成语·辨析",d:2},
{id:"CY066",c:"yy",q:"“比喻基础牢固结实，不容易动摇”的成语是（　）。",o:["根深蒂固","坚如磐石","积重难返","盘根错节"],a:0,e:"根深蒂固是一棵老树的底气：根扎得越深、蒂（瓜果与枝茎的连接处）长得越牢，风再大也撼不动。注意它偏中性或贬义（多形容观念、习惯难以改变）；坚如磐石是褒义的坚固。",s:"成语·释义",d:1},
{id:"CY067",c:"yy",q:"“受到无数次的挫折都不屈服，形容意志坚强”的成语是（　）。",o:["百折不挠","坚忍不拔","不屈不挠","宁死不屈"],a:0,e:"百折不挠自带进度条：折了一百次，第一百零一次照样站起来。“折”是挫折，“挠”是弯——被打折多少回也不弯腰。坚忍不拔偏“在艰难中坚持”的韧性，语感更沉。",s:"成语·释义",d:1},
{id:"CY068",c:"yy",q:"“形容藏书极多”的成语是（　），搬运时能让牛累出汗、存放时能堆到栋梁。",o:["汗牛充栋","浩如烟海","左图右史","坐拥书城"],a:0,e:"汗牛充栋是古人的凡尔赛：家里书多到搬家时牛拉得直冒汗、屋里堆到顶着房梁。两个动作（搬家、堆放）限定了它只用于“藏书多”——不能形容别的东西多，这是它最常考的陷阱。",s:"成语·用法",d:2},
{id:"CY069",c:"yy",q:"条件一旦成熟，事情自然会成功，正所谓________。横线处最恰当的成语是（　）。",o:["水到渠成","瓜熟蒂落","顺理成章","一蹴而就"],a:0,e:"水到渠成是大禹的智慧：不用刨地，水流过去，沟渠自然冲出来了。它与瓜熟蒂落同属“自然成功系”；顺理成章重“合乎逻辑”；一蹴而就强调“一步就成”（多用于否定句“非一蹴而就”）。",s:"成语·语境",d:1},
{id:"CY070",c:"yy",q:"“刻苦钻研，到达了他人所不能及的地步；也指煞费苦心寻求解决办法”的成语是（　）。",o:["苦心孤诣","殚精竭虑","呕心沥血","绞尽脑汁"],a:0,e:"苦心孤诣的“孤诣”是孤独的巅峰——功夫下到别人到不了的高度，站得高也站得冷。它常与“惨淡经营”连用。殚精竭虑、呕心沥血偏“用尽心血”，不强调“独到境界”。",s:"成语·释义",d:2},
{id:"CY071",c:"yy",q:"“比喻学问、技艺等达到了纯熟完善的地步”的成语是（　），源自道家炼丹炉火变为纯青色时丹已炼成。",o:["炉火纯青","登峰造极","出神入化","挥洒自如"],a:0,e:"炉火纯青藏着一炉神秘的丹火：外行看火色青了，内行知道——成了。它自带“千锤百炼终成正果”的质感，多形容技艺学问；登峰造极偏“达到顶点”（有时贬义“造极”到头了）；出神入化偏“神妙不可测”。",s:"成语·典故",d:2},
{id:"CY072",c:"yy",q:"“形容口才好，说话滔滔不绝”的成语是（　）。",o:["口若悬河","妙语连珠","侃侃而谈","对答如流"],a:0,e:"口若悬河的“悬河”是瀑布——话匣子一开，嘴边像挂了条瀑布，讲三天三夜不见底。妙语连珠重“句句精彩”；侃侃而谈重“从容不迫”；对答如流重“应答敏捷”。",s:"成语·辨析",d:1},
{id:"CY073",c:"yy",q:"技艺与文明________，代代相传，从未断绝。横线处最恰当的成语是（　）。",o:["薪火相传","口耳相传","代代相传","继往开来"],a:0,e:"薪火相传的画面来自烧火做饭：一根柴烧尽前，用它的火苗点燃下一根——柴有穷尽，火种不灭。《庄子》“指穷于为薪，火传也，不知其尽也”。它专用于学问、技艺、精神的代际传承。",s:"成语·语境典故",d:2},
{id:"CY074",c:"yy",q:"“集中众人的智慧和意见，以便取得更好的效果”的成语是（　）。",o:["集思广益","群策群力","博采众长","从善如流"],a:0,e:"集思广益像开圆桌会：一个人的脑袋有限，十个人的主意凑一凑，路就宽了。群策群力偏“共同出力做事”；博采众乐重“广泛吸取各家长处”；从善如流是“听到好意见立刻采纳”。",s:"成语·辨析",d:1},

/* —— 高频词语辨析（选自公考加油站安徽高频词语统计） —— */
{id:"W001",c:"yy",q:"这座城市以开放包容的姿态把八方来客________其中，形成了独特的移民文化。横线处最恰当的词语是（　）。",o:["融入","融合","汇合","加入"],a:0,e:"融入强调“进入其中、成为一部分”——像一勺盐化进汤里，尝得到咸味却再找不到盐粒。融合则是双向的“合为一体”（中外文化融合）。方向感不同：融入是“我进入你”，融合是“你中有我”。",s:"词语·辨析",d:1},
{id:"W002",c:"yy",q:"博物馆用数字技术让文物“活”起来，使千年文脉得以更好________。横线处最恰当的词语是（　）。",o:["传承","传播","传递","传达"],a:0,e:"传承是接力棒——手递手地往下传，接棒人还要继续跑（强调代际延续+发扬）；传播是撒网——把信息推得广（范围维度）；传递是一站一站中转；传达多指上级精神告知下级。文脉、技艺、精神配“传承”。",s:"词语·辨析",d:1},
{id:"W003",c:"yy",q:"营养摄入________、荤素搭配合理，是健康的基石。横线处最恰当的词语是（　）。",o:["均衡","平衡","平均","平等"],a:0,e:"均衡是“各部分比例恰当”——营养像调配鸡尾酒，各种成分不多不少刚好；平衡侧重“对立双方相抵”（收支平衡、心理平衡）；平均是数学上的均分（每人平均三本）；平等是地位同等。",s:"词语·辨析",d:1},
{id:"W004",c:"yy",q:"少数国家频繁________他国内政，遭到国际社会普遍反对。横线处最恰当的词语是（　）。",o:["干预","干扰","介入","干涉"],a:3,e:"干涉是“强行过问、横加插手”，贬义最重，配“他国内政”最贴切；干预是中性的“参与过问其事”（宏观调控干预）；干扰是“扰乱使其不能正常进行”（信号干扰）；介入是中性词“插入其间参与其中”（介入调查）。",s:"词语·辨析",d:2},
{id:"W005",c:"yy",q:"当地大力________本土品牌，帮中小企业闯出了一条出山路。横线处最恰当的词语是（　）。",o:["培植","培育","扶持","培养"],a:2,e:"扶持最贴“帮扶+支撑”之意，且常与中小企业、品牌搭配；培育偏“培育幼苗般的呵护成长”（培育新业态、市场）；培植对象多为植物或势力（培植亲信略带贬义）；培养对象是人（培养人才）。",s:"词语·辨析",d:2},
{id:"W006",c:"yy",q:"要________中华优秀传统文化，让古老智慧焕发时代光彩。横线处最恰当的词语是（　）。",o:["弘扬","发扬","宣传","提倡"],a:0,e:"弘扬专接“精神类大词”——文化、精神、传统、正气，像吹响号角让声音传远；发扬范围更宽（发扬风格、发扬民主）；宣传偏“广而告之”；提倡是倡导带头。固定搭配题里，文化+弘扬几乎绑定。",s:"词语·搭配",d:1},
{id:"W007",c:"yy",q:"良好的生态持续________着这片土地，也________出新的问题——过度的旅游开发让垃圾在山间悄然________。依次填入最恰当的一组是（　）。",o:["滋养 / 滋生 / 滋生","滋生 / 滋养 / 滋养","滋养 / 滋养 / 滋生","滋生 / 滋生 / 滋养"],a:0,e:"滋养是甘霖——浇灌大地使之丰美（褒义）；滋生是阴湿角落的杂草——坏东西悄悄冒头（贬义居多：滋生腐败、滋生细菌）。一字之差，褒贬两分：好生态“滋养”土地，坏环境“滋生”问题。",s:"词语·色彩",d:2},
{id:"W008",c:"yy",q:"这份报告的内容________了经济、社会、生态等多个领域。横线处最恰当的词语是（　）。",o:["涵盖","包含","囊括","覆盖"],a:0,e:"涵盖像一把撑开的大伞——伞面之下各个领域都罩住了（多用于内容范围抽象事物）；包含是“里面有”（整体含部分）；囊括是“一网打尽全部”（囊括金牌，程度最高）；覆盖本义是遮盖地面（信号覆盖），用于抽象是比喻。",s:"词语·辨析",d:2},
{id:"W009",c:"yy",q:"在灯光映照下，壁画上的飞天形象愈发________，成为展馆最亮眼的看点。横线处最恰当的词语是（　）。",o:["凸显","突显","彰显","显示"],a:0,e:"凸显是“清晰地显现出来”——像聚光灯下轮廓越来越清楚，多接形象、问题、矛盾；突显强调“突然显现”（猝不及防地跳出来）；彰显是“鲜明地显示”（多接意义、价值、精神，书面且庄重）。",s:"词语·辨析",d:2},
{id:"W010",c:"yy",q:"短视的流量思维正在悄悄________着行业的根基。横线处最恰当的词语是（　）。",o:["侵蚀","侵占","侵袭","腐化"],a:0,e:"侵蚀像酸雨对石像的慢功夫——一天看不出变化，十年后面目模糊，专用于“逐渐地、暗中地破坏”（侵蚀根基、侵蚀肌体）；侵占是明抢（侵占财产）；侵袭是外来的猛烈攻击（寒流侵袭）；腐化多指人的堕落。",s:"词语·辨析",d:2},
{id:"W011",c:"yy",q:"对政策的一次________尚可解释，但有意________、断章取义就另当别论了。依次填入最恰当的一组是（　）。",o:["误解 / 曲解","曲解 / 误解","误解 / 误会","曲解 / 曲折"],a:0,e:"误解是无意读歪——眼镜度数不合适，看岔了（无心之失）；曲解是故意读歪——明明看清了，偏把直的说成弯的（存心歪曲）。“曲”字自带“拐弯抹角使坏”的意味，褒贬立判。",s:"词语·辨析",d:2},
{id:"W012",c:"yy",q:"这份方案与本地实际高度________，落地阻力很小。横线处最恰当的词语是（　）。",o:["契合","吻合","符合","切合"],a:0,e:"契合是齿轮咬合——两个轮子的齿一一对上，转起来不打滑（可指精神气质层面的投合）；吻合像两张描图纸叠在一起严丝合缝（重“完全一致”，如数据吻合）；符合是“达到标准”（符合条件）；切合强调“切中实际”（切合实际）。",s:"词语·辨析",d:2},
{id:"W013",c:"yy",q:"执法者当________法律底线，不为任何利益所动。横线处最恰当的词语是（　）。",o:["恪守","遵守","遵循","坚守"],a:0,e:"恪守的“恪”是恭敬——像卫士执戟立于宫门，心存敬畏寸步不让，语感最庄重，专配“底线、原则、承诺”；遵守是一般性的照章办事（遵守交通规则）；遵循偏“依照指引行事”（遵循规律）。",s:"词语·辨析",d:2},
{id:"W014",c:"yy",q:"新任局长到岗后迅速________，第一周就走遍了全部基层站所。横线处最恰当的词语是（　）。",o:["履职","履新","任职","就学"],a:1,e:"履新专指“就任新职”——像换上一双新鞋走新路，自带“新人新起点”的语感；履职是“履行职责”（干工作本身，无“新”义）。两词都高频，考的就是这一个“新”字。",s:"词语·辨析",d:1},
{id:"W015",c:"yy",q:"科技________了产业升级，也让传统工匠精神获得前所未有的________。依次填入最恰当的一组是（　）。",o:["推动 / 推崇","推崇 / 推动","推动 / 推辞","推荐 / 推崇"],a:0,e:"推动是发动机——从背后给力使其前进（推动改革、推动发展）；推崇是后人立碑——高度评价并敬重（备受推崇）。前者施力于事，后者致意于人。",s:"词语·辨析",d:1},
{id:"W016",c:"yy",q:"文艺精品既能________城市软实力，也能________市民幸福感。依次填入最恰当的一组是（　）。",o:["提升 / 增强","增强 / 提升","提高 / 扩大","扩大 / 提高"],a:0,e:"提升专接“抽象层级词”——软实力、水平、品质（从低档位往高档位拨）；增强接“程度力量词”——信心、实力、体质（像肌肉变厚）。提高同提升但更口语；扩大接“范围词”（扩大影响）。",s:"词语·搭配",d:1},
{id:"W017",c:"yy",q:"这项制度在全省________推开，各地________反映良好。依次填入最恰当的一组是（　）。",o:["普遍 / 广泛","广泛 / 普遍","广泛 / 广泛","普遍 / 普遍"],a:0,e:"广泛是撒网——范围大、涉及面广（广泛推行、广泛听取）；普遍是统计——到处都如此、带共同性（普遍现象、普遍反映）。一个管“面积”，一个管“占比”。",s:"词语·辨析",d:2},
{id:"W018",c:"yy",q:"他________了成见，虚心听取不同意见，方案因此更完善。横线处最恰当的词语是（　）。",o:["摒弃","放弃","抛弃","离弃"],a:0,e:"摒弃是“坚决地丢掉不需要的东西”——像倒垃圾一样干脆，多接思想、观念等抽象物（摒弃杂念）；放弃是中性的“不再坚持”（放弃比赛）；抛弃对象可人可物，语感较重（抛弃家庭）。",s:"词语·辨析",d:2},
{id:"W019",c:"yy",q:"做学问要善于从典籍中________智慧，而不是机械地________知识。依次填入最恰当的一组是（　）。",o:["汲取 / 摄取","摄取 / 汲取","吸收 / 摄取","汲取 / 吸收"],a:0,e:"汲取原义是打水——从深井里提上来，强调“主动获取精华”（汲取智慧、汲取力量，书面庄重）；摄取向“摄入营养”——多为生理性、技术性的吸取（摄取食物、镜头摄取画面）。",s:"词语·辨析",d:2},
{id:"W020",c:"yy",q:"必须坚决________违法犯罪的苗头，同时努力________矛盾纠纷。依次填入最恰当的一组是（　）。",o:["遏制 / 化解","遏止 / 缓解","遏制 / 化解","遏止 / 化解"],a:2,e:"遏制是踩刹车——控制住使其不再发展（遏制势头，动作可持续）；遏止是急停键——使之停止（遏止暴行，语义更重）；化解是把矛盾揉散开（大事化小）；缓解只是“程度减轻”。",s:"词语·辨析",d:2},
{id:"W021",c:"yy",q:"考古工作者用小刷子一点点________历史的细节，像在完成一场跨越千年的________。依次填入最恰当的一组是（　）。",o:["揭示 / 对话","揭露 / 对话","揭示 / 交谈","揭穿 / 交流"],a:0,e:"揭示是掀开面纱——把不易看清的事物亮出来（揭示规律、揭示细节，中性庄重）；揭露是撕下伪装——针对隐瞒的坏事（揭露罪行，带斗争色彩）；揭穿是戳穿谎言（贬义对象）。",s:"词语·辨析",d:2},
{id:"W022",c:"yy",q:"青年当在基层的沃土中经风雨、壮筋骨，在摸爬滚打中________成长。横线处最恰当的词语是（　）。",o:["磨砺","磨练","磨擦","锻炼"],a:0,e:"磨砺原是磨刀石上蹭出锋刃——宝剑锋从磨砺出，自带“越磨越利”的升华感；磨练偏“忍耐熬炼”（意志磨练）；磨擦是物理摩擦（且易误作“摩擦”）；锻炼最通用。语境要“拔高”时选磨砺。",s:"词语·辨析",d:1},
{id:"W023",c:"yy",q:"（2024安徽真题改编）某商业银行客户已具备1年投资经历，银行在向其销售理财产品前，应当先________其风险承受能力。横线处最恰当的词语是（　）。",o:["评估","评价","评论","估计"],a:0,e:"评估是量化打分——按既定维度给风险承受能力“量体温”（专业程序性动作）；评价是论好坏（偏定性）；评论是公开发议论（媒体行为）；估计是粗略估摸（不严谨）。金融合规语境必用评估。",s:"词语·语境",d:1},
{id:"W024",c:"yy",q:"一代代建设者用心________着“美好安徽”的城市名片。横线处最恰当的词语是（　）。",o:["打造","创造","制造","营造"],a:0,e:"打造是铁匠抡锤——千锤百炼出好钢，多接“品牌、名片、形象”（褒义且带匠心感）；创造是“做出前所未有的事”（创造奇迹）；制造本义是工业生产（且“制造矛盾”带贬义）；营造多接“氛围、环境”。",s:"词语·搭配",d:1},
{id:"W025",c:"yy",q:"面对群众的急难愁盼，干部要沉下身子认真________，把情况摸准吃透。横线处最恰当的词语是（　）。",o:["体察","考察","视察","观察"],a:0,e:"体察自带体温——带着感情贴近群众去体悟实情（体察民情）；考察是带着任务去核实评估（干部考察、实地考察）；视察是上级居高临下的检查指导（领导视察）；观察是中性的“看”（观察天象）。",s:"词语·辨析",d:2},

];
